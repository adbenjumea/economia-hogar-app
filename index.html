/* ---------- Sincronización en la nube: repositorio PRIVADO de GitHub, con cifrado en el dispositivo ----------
   Los datos se cifran con AES-GCM (clave derivada de tu contraseña con PBKDF2) ANTES de salir del dispositivo.
   GitHub solo ve un archivo cifrado (datos.enc.json). Cada dispositivo guarda su token (y, si quieres, la contraseña) solo en su navegador. */
const CLOUD_KEY="economia-hogar-cloud", CLOUD_FILE="datos.enc.json", PBKDF2_ITER=600000, AAD="economia-hogar-v1";
const cloud={cfg:null,on:false,dirty:false,busy:false,pulling:false,conflict:false,remote:null,t:null,state:"off",err:"",pass:null,keyCache:null};
const _enc=new TextEncoder(), _dec=new TextDecoder();
function b64e(buf){ const u=new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(s); }
function b64d(s){ const bin=atob(s), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
async function sha256b64(text){ return b64e(await crypto.subtle.digest("SHA-256",_enc.encode(text))); }
function cloudErr(code,msg,status){ const e=new Error(msg); e.code=code; e.status=status; return e; }
function cloudLoadCfg(){ try{ const c=JSON.parse(localStorage.getItem(CLOUD_KEY)); if(c&&c.repo&&c.token) return c; }catch(e){} return null; }
function cloudSaveCfg(){ try{ localStorage.setItem(CLOUD_KEY,JSON.stringify(cloud.cfg)); }catch(e){} }
function hasLocalData(){ return Object.keys(S.months).length>0; }

/* --- cifrado --- */
async function cloudKey(pass,salt,saltB64,iter){
  const id=saltB64+"|"+iter+"|"+await sha256b64(pass);       // la clave derivada se guarda solo en memoria, mientras la página esté abierta
  if(cloud.keyCache&&cloud.keyCache.id===id) return cloud.keyCache.key;
  const base=await crypto.subtle.importKey("raw",_enc.encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  cloud.keyCache={id,key}; return key;
}
async function cloudEncrypt(text,pass,saltB64,aad=AAD){
  const salt=saltB64?b64d(saltB64):crypto.getRandomValues(new Uint8Array(16)), sb=saltB64||b64e(salt);
  const key=await cloudKey(pass,salt,sb,PBKDF2_ITER), iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:_enc.encode(aad)},key,_enc.encode(text));
  return {v:1,app:"economia-hogar",kdf:"PBKDF2-SHA256",iter:PBKDF2_ITER,salt:sb,iv:b64e(iv),ct:b64e(ct)};
}
async function cloudDecrypt(env,pass,aad=AAD){
  if(!env||env.v!==1||!env.ct||!env.iv||!env.salt) throw cloudErr("format","El archivo de la nube no tiene el formato esperado.");
  const iter=Math.min(Math.max(+env.iter||PBKDF2_ITER,100000),2000000);   // límites, por si el archivo estuviera manipulado
  const key=await cloudKey(pass,b64d(env.salt),env.salt,iter);
  try{ return _dec.decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(env.iv),additionalData:_enc.encode(aad)},key,b64d(env.ct))); }
  catch(e){ throw cloudErr("pass","Contraseña de cifrado incorrecta (o el archivo está dañado)."); }
}
function askPass(msg){   // ventana para pedir la contraseña (no se muestra en pantalla)
  return new Promise(res=>{
    const d=document.createElement("dialog");
    d.innerHTML=`<form method="dialog"><h3>${esc(msg)}</h3><input type="password" class="txt" autocomplete="current-password" aria-label="Contraseña"><div class="toolbar" style="margin:12px 0 0"><button class="btn primary" value="ok">Aceptar</button><button class="btn" value="cancel">Cancelar</button></div></form>`;
    document.body.appendChild(d);
    d.addEventListener("close",()=>{ const v=d.returnValue==="ok"?d.querySelector("input").value:null; d.remove(); res(v||null); });
    d.showModal(); d.querySelector("input").focus();
  });
}
async function cloudPass(){
  if(cloud.pass) return cloud.pass;
  if(cloud.cfg&&cloud.cfg.pass){ cloud.pass=cloud.cfg.pass; return cloud.pass; }
  const p=await askPass("Contraseña de cifrado de tus datos en la nube"); if(!p) throw cloudErr("pass","Hace falta la contraseña de cifrado.");
  cloud.pass=p; return p;
}

/* --- API de GitHub --- */
function ghFetch(path,opt={}){
  return fetch("https://api.github.com"+path,{cache:"no-store",...opt,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+cloud.cfg.token,"X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}});
}
async function ghError(r){
  let m=""; try{ m=(await r.json()).message||""; }catch(_){}
  const msg=r.status===401?"El token no es válido o ha caducado.":r.status===403?"GitHub rechazó la petición (permisos del token o límite de uso). "+m:r.status===404?"No se encuentra el repositorio o el token no tiene acceso a él.":"GitHub respondió "+r.status+". "+m;
  return cloudErr("http",msg,r.status);
}
async function cloudCheckRepo(){
  const r=await ghFetch(`/repos/${cloud.cfg.repo}`); if(!r.ok) throw await ghError(r);
  const j=await r.json();
  if(!j.private) throw cloudErr("public","Ese repositorio es PÚBLICO: cualquiera vería tus datos cifrados. Usa un repositorio privado.");
  if(j.permissions&&j.permissions.push===false) throw cloudErr("perm","El token no tiene permiso de escritura en ese repositorio (Contents: Read and write).");
  return j;
}
async function cloudGetRemote(){
  const r=await ghFetch(`/repos/${cloud.cfg.repo}/contents/${CLOUD_FILE}`);
  if(r.status===404) return {exists:false};
  if(!r.ok) throw await ghError(r);
  const j=await r.json(); let content=j.content;
  if(!content||j.encoding!=="base64"){   // archivos de más de 1 MB: se pide el contenido por la API de blobs
    const b=await ghFetch(`/repos/${cloud.cfg.repo}/git/blobs/${j.sha}`); if(!b.ok) throw await ghError(b);
    content=(await b.json()).content;
  }
  return {exists:true,sha:j.sha,env:JSON.parse(_dec.decode(b64d(content.replace(/\s/g,""))))};
}

/* --- estado visible --- */
const CLOUD_TXT={off:"",sync:"☁ Sincronizando…",ok:"☁ Sincronizado",offline:"☁ Sin conexión: se subirá al volver",error:"☁ Error de sincronización",conflict:"☁ Conflicto: pulsa para resolver",pass:"☁ Falta la contraseña: pulsa"};
function cloudLineHtml(){
  if(!cloud.cfg) return "Sin conectar.";
  const t={sync:"Sincronizando…",ok:"Sincronizado.",offline:"Sin conexión: los cambios se subirán al volver.",error:"Error: "+esc(cloud.err),conflict:"Conflicto: hay cambios en la nube y en este dispositivo (pulsa el aviso de arriba para resolverlo).",pass:"Falta la contraseña de cifrado.",off:""}[cloud.state]||"";
  const ls=cloud.cfg.lastSync?` Última sincronización: ${new Date(cloud.cfg.lastSync).toLocaleString("es-ES")}.`:"";
  return `<b>${esc(cloud.cfg.repo)}</b> · ${t}${ls}`;
}
function setCloud(st,e){
  cloud.state=st; cloud.err=e?(e.message||String(e)):"";
  const el=document.getElementById("cloudstatus");
  if(el){ el.textContent=CLOUD_TXT[st]||""; el.style.color=st==="ok"?"var(--ok)":(st==="sync"||st==="offline")?"var(--muted)":"var(--bad)"; el.style.cursor=(st==="conflict"||st==="pass"||st==="error"||st==="offline")?"pointer":""; el.title=cloud.err; }
  const ln=document.getElementById("cloudline"); if(ln) ln.innerHTML=cloudLineHtml();
}
function cloudFail(e){
  if(e&&e.code==="pass"){ cloud.pass=null; if(cloud.cfg&&cloud.cfg.pass){ delete cloud.cfg.pass; cloudSaveCfg(); } setCloud("pass",e); }
  else if(!navigator.onLine||e instanceof TypeError) setCloud("offline",e);
  else setCloud("error",e);
}

/* --- sincronización --- */
async function cloudAdopt(rem){   // reemplaza los datos de este dispositivo por los de la nube
  const text=await cloudDecrypt(rem.env,await cloudPass());
  S=migrate(JSON.parse(text)); cloud.dirty=false; cloud.conflict=false; cloud.remote=null;
  cloud.cfg.sha=rem.sha; cloud.cfg.salt=rem.env.salt; cloud.cfg.lastHash=await sha256b64(JSON.stringify(S)); cloud.cfg.pending=null; cloud.cfg.lastSync=Date.now(); cloudSaveCfg();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  if(srv.on){ srv.dirty=true; clearTimeout(srv.t); srv.t=setTimeout(pushServer,300); }
  setCloud("ok"); render();
}
async function cloudPush(force,leaving){   // leaving: la app se cierra o pasa a segundo plano
  if(!cloud.on||cloud.busy||cloud.pulling||cloud.conflict||(!cloud.dirty&&!force)) return;
  cloud.busy=true; cloud.dirty=false; setCloud("sync");
  let again=false, recheck=false;
  try{
    migrate(S);   // se normaliza antes de subir (así «lo local» y «lo de la nube» tienen siempre la misma forma)
    const text=JSON.stringify(S), hash=await sha256b64(text);   // se sube una «foto» de los datos; si cambian durante la subida, se vuelve a subir
    const env=await cloudEncrypt(text,await cloudPass(),cloud.cfg.salt||null);
    const body={message:"Sincronización "+new Date().toISOString(),content:b64e(_enc.encode(JSON.stringify(env)))};
    if(cloud.cfg.sha) body.sha=cloud.cfg.sha;
    // se apunta qué versión se está subiendo: si la app se cierra antes de recibir la respuesta, al volver se reconoce como propia
    cloud.cfg.pending=[...(cloud.cfg.pending||[]),hash].slice(-5); cloudSaveCfg();
    const json=JSON.stringify(body);
    const r=await ghFetch(`/repos/${cloud.cfg.repo}/contents/${CLOUD_FILE}`,{method:"PUT",body:json,keepalive:!!leaving&&json.length<60000});   // keepalive: termina aunque se cierre la página (máx. 64 KB)
    if(r.status===409||r.status===422) throw cloudErr("stale");   // alguien subió antes (o fue esta misma subida): se comprueba abajo
    if(!r.ok) throw await ghError(r);
    const j=await r.json(); cloud.cfg.sha=j.content.sha; cloud.cfg.salt=env.salt; cloud.cfg.lastHash=hash; cloud.cfg.pending=null; cloud.cfg.lastSync=Date.now(); cloudSaveCfg();
    setCloud("ok"); again=cloud.dirty;
  }catch(e){ cloud.dirty=true; if(e.code==="stale") recheck=true; else cloudFail(e); }
  finally{ cloud.busy=false; }
  if(recheck) cloudPull(); else if(again) cloudPush();
}
async function cloudIsOurs(rem){   // ¿lo de la nube es una subida de este dispositivo cuya respuesta no llegó?
  if(!(cloud.cfg.pending||[]).length) return false;
  const h=await sha256b64(await cloudDecrypt(rem.env,await cloudPass()));
  if(!cloud.cfg.pending.includes(h)) return false;
  cloud.cfg.sha=rem.sha; cloud.cfg.salt=rem.env.salt; cloud.cfg.lastHash=h; cloud.cfg.pending=null; cloud.cfg.lastSync=Date.now(); cloudSaveCfg();
  return true;
}
async function cloudPull(){
  if(!cloud.on||cloud.pulling||cloud.busy) return;
  cloud.pulling=true; setCloud("sync");
  try{
    const rem=await cloudGetRemote();
    const changed=cloud.dirty||(await sha256b64(JSON.stringify(S)))!==cloud.cfg.lastHash;   // ¿hay cambios locales sin subir?
    if(!rem.exists){ if(hasLocalData()){ cloud.dirty=true; cloud.cfg.sha=null; } else setCloud("ok"); }
    else if(rem.sha===cloud.cfg.sha){ if(changed) cloud.dirty=true; else setCloud("ok"); }
    else if(changed&&await cloudIsOurs(rem)){ if((await sha256b64(JSON.stringify(S)))!==cloud.cfg.lastHash) cloud.dirty=true; else setCloud("ok"); }
    else if(changed){ cloud.conflict=true; cloud.remote=rem; cloud.dirty=true; setCloud("conflict"); }   // cambió en los dos sitios
    else await cloudAdopt(rem);
  }catch(e){ cloudFail(e); }
  finally{ cloud.pulling=false; }
  if(cloud.dirty&&!cloud.conflict&&cloud.state!=="pass") cloudPush();
}
async function cloudResolve(){
  try{
    const rem=cloud.remote||await cloudGetRemote();
    if(confirm("Los datos han cambiado en otro dispositivo y también en este.\n\nAceptar = usar los de la NUBE (antes se descarga una copia de lo de este dispositivo).\nCancelar = otras opciones.")){
      backupDownload("antes-de-usar-la-nube"); cloud.conflict=false; await cloudAdopt(rem); return;
    }
    if(confirm("¿Subir lo de ESTE dispositivo y reemplazar lo de la nube?\n(GitHub guarda el historial del archivo, así que se podría recuperar.)")){
      cloud.conflict=false; cloud.cfg.sha=rem.exists===false?null:rem.sha; cloud.dirty=true; cloudSaveCfg(); await cloudPush(true);
    }
  }catch(e){ cloudFail(e); }
}
async function cloudConnect(){   // desde el formulario de Ajustes
  const v=id=>(document.getElementById(id)||{}).value||"";
  return cloudConnectWith({repo:v("cloudrepo").trim().replace(/^https?:\/\/github\.com\//,"").replace(/\.git$/,"").replace(/\/$/,""),
    token:v("cloudtoken").trim(), pass:v("cloudpass"), pass2:v("cloudpass2"), remember:!!(document.getElementById("cloudremember")||{}).checked});
}
async function cloudConnectWith({repo,token,pass,pass2,remember}){   // desde el formulario o desde un enlace de vinculación
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ alert("Indica el repositorio como usuario/repositorio, por ejemplo mi-usuario/economia-hogar-datos."); return; }
  if(!token){ alert("Pega el token de GitHub."); return; }
  if(pass.length<8){ alert("La contraseña de cifrado debe tener al menos 8 caracteres."); return; }
  if(!(window.crypto&&crypto.subtle)){ alert("Este navegador no permite cifrar en esta dirección. Abre la app desde una dirección https."); return; }
  cloud.cfg={repo,token,sha:null,lastHash:null,salt:null}; cloud.pass=pass; cloud.keyCache=null; if(remember) cloud.cfg.pass=pass;
  cloud.conflict=false; cloud.dirty=false;
  try{
    setCloud("sync"); await cloudCheckRepo();
    const rem=await cloudGetRemote();
    if(rem.exists){
      const remHas=Object.keys(JSON.parse(await cloudDecrypt(rem.env,pass)).months||{}).length>0;   // además comprueba la contraseña antes de tocar nada
      if(hasLocalData()&&remHas){
        if(confirm("Ya hay datos en la nube y también en este dispositivo.\n\nAceptar = usar los de la NUBE (antes se descarga una copia de lo de este dispositivo).\nCancelar = elegir otra opción.")){ backupDownload("antes-de-usar-la-nube"); await cloudAdopt(rem); }
        else if(confirm("¿Subir lo de ESTE dispositivo y reemplazar lo de la nube?\n(GitHub guarda el historial del archivo, así que se podría recuperar.)")){ cloud.cfg.sha=rem.sha; cloud.cfg.salt=rem.env.salt; cloud.dirty=true; }
        else{ cloud.cfg=null; cloud.pass=null; setCloud("off"); return; }
      } else if(hasLocalData()){ cloud.cfg.sha=rem.sha; cloud.cfg.salt=rem.env.salt; cloud.dirty=true; }   // la nube estaba vacía: se sube lo de este dispositivo
      else await cloudAdopt(rem);
    } else {
      if(pass!==pass2) throw cloudErr("pass","Las dos contraseñas no coinciden: es la primera vez y no se puede recuperar si te equivocas.");
      cloud.dirty=true;
    }
    cloud.on=true; cloudSaveCfg(); setStatus(srv.state);
    if(cloud.dirty) await cloudPush(true); else setCloud("ok");
    render();
  }catch(e){ cloud.on=false; cloud.cfg=null; cloud.pass=null; setCloud("off"); alert(e.message||String(e)); }
}
function cloudDisconnect(){
  if(!confirm("Este dispositivo dejará de sincronizar y se olvidará el token y la contraseña. Los datos de la nube y los de este dispositivo no se borran. ¿Continuar?")) return;
  try{ localStorage.removeItem(CLOUD_KEY); }catch(e){}
  cloud.cfg=null; cloud.on=false; cloud.pass=null; cloud.keyCache=null; cloud.conflict=false; cloud.dirty=false; setCloud("off"); setStatus(srv.state); render();
}
function cloudSyncNow(){ if(!cloud.on) return; if(cloud.conflict) cloudResolve(); else cloudPull(); }
/* --- Vincular otro dispositivo con un enlace: el repositorio y el token viajan CIFRADOS con tu contraseña --- */
const LINK_AAD="economia-hogar-vincular-v1";
const TOKEN_URL="https://github.com/settings/personal-access-tokens/new?name="+encodeURIComponent("Economía del Hogar (datos)")
  +"&description="+encodeURIComponent("Sincronización cifrada de la app Economía del Hogar. Dar acceso SOLO al repositorio de datos.")+"&expires_in=366&contents=write";
function b64urlEnc(s){ return b64e(_enc.encode(s)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64urlDec(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; return _dec.decode(b64d(s)); }
function appWebUrl(){   // la web publicada: la actual si ya estamos en ella; si no, la de GitHub Pages del dueño del repositorio de datos
  if(location.protocol==="https:") return location.origin+location.pathname;
  const owner=((cloud.cfg&&cloud.cfg.repo)||"").split("/")[0];
  return `https://${owner}.github.io/economia-hogar-app/`;
}
async function cloudMakeLink(){
  if(!cloud.cfg) return;
  try{
    const pass=await cloudPass();
    const env=await cloudEncrypt(JSON.stringify({repo:cloud.cfg.repo,token:cloud.cfg.token}),pass,null,LINK_AAD);
    showLinkDialog(appWebUrl()+"#vincular="+b64urlEnc(JSON.stringify({v:1,s:env.salt,i:env.iv,c:env.ct})));
  }catch(e){ cloudFail(e); }
}
function showLinkDialog(link){
  const d=document.createElement("dialog");
  d.innerHTML=`<h3>📱 Vincular otro dispositivo</h3>
    <ol class="muted" style="margin:0 0 10px;padding-left:18px;line-height:1.55">
      <li>Pulsa <b>Copiar enlace</b>. Con la misma cuenta de Apple, lo copiado aquí se puede pegar en el iPhone (portapapeles universal); si no, envíatelo por WhatsApp, Notas o correo y cópialo allí.</li>
      <li>En el otro dispositivo abre la app (la de la pantalla de inicio) → <b>Ajustes → Pegar enlace de vinculación</b>.</li>
      <li>Escribe la <b>misma contraseña de cifrado</b>. Listo.</li></ol>
    <p class="hint" style="margin:0 0 10px">El enlace va cifrado: sin la contraseña no sirve de nada.</p>
    <input class="txt" readonly value="${esc(link)}" aria-label="Enlace de vinculación" style="font-size:12px">
    <div class="toolbar" style="margin:12px 0 0">${navigator.share?`<button class="btn primary" data-l="share">Compartir…</button>`:""}<button class="btn ${navigator.share?"":"primary"}" data-l="copy">Copiar enlace</button><button class="btn" data-l="close">Cerrar</button></div>
    <div class="hint" data-l="msg"></div>`;
  document.body.appendChild(d);
  d.addEventListener("click",async e=>{
    const a=e.target.dataset&&e.target.dataset.l, msg=d.querySelector("[data-l=msg]"); if(!a) return;
    if(a==="close") d.close();
    else if(a==="copy"){ try{ await navigator.clipboard.writeText(link); msg.textContent="Copiado. Con la misma cuenta de Apple puedes pegarlo directamente en el iPhone (portapapeles universal)."; }
      catch(_){ d.querySelector("input").select(); msg.textContent="Está seleccionado: cópialo con Cmd+C."; } }
    else if(a==="share"){ try{ await navigator.share({title:"Vincular Economía del Hogar",url:link}); }catch(_){} }
  });
  d.addEventListener("close",()=>d.remove());
  d.showModal(); d.querySelector("input").select();
}
function linkCodeOf(text){   // acepta el enlace completo o solo el código
  const m=String(text||"").trim().match(/(?:#vincular=)?([A-Za-z0-9_-]{40,})\s*$/);
  return m?m[1]:null;
}
function choose(title,html,buttons,onPick){   // ventana con varias opciones; devuelve la clave del botón pulsado (o null)
  return new Promise(res=>{
    const d=document.createElement("dialog");
    d.innerHTML=`<h3>${title}</h3>${html}<div class="toolbar" style="margin:14px 0 0">${buttons.map(([k,t,p])=>`<button class="btn ${p?"primary":""}" data-k="${k}">${t}</button>`).join("")}</div>`;
    document.body.appendChild(d); let v=null;
    // onPick se llama dentro del propio toque: iOS solo deja copiar al portapapeles en ese momento
    d.addEventListener("click",e=>{ const k=e.target.closest("[data-k]"); if(k){ v=k.dataset.k; if(onPick) onPick(v); d.close(); } });
    d.addEventListener("close",()=>{ d.remove(); res(v); });
    d.showModal();
  });
}
async function cloudPasteLink(){   // «Pegar enlace de vinculación» (sobre todo para la app de la pantalla de inicio)
  let text="";
  try{ text=await navigator.clipboard.readText(); }catch(_){}
  let code=linkCodeOf(text);
  if(!code){   // sin permiso para leer el portapapeles o no había enlace: se pega a mano
    const d=document.createElement("dialog");
    d.innerHTML=`<h3>📋 Pegar enlace de vinculación</h3>
      <p class="muted" style="margin:0 0 10px">Mantén pulsado el recuadro y elige <b>Pegar</b>. El enlace se crea en el dispositivo ya conectado: <i>Ajustes → Vincular otro dispositivo → Copiar enlace</i>.</p>
      <textarea class="txt" rows="4" placeholder="https://…#vincular=…" autocapitalize="off" autocorrect="off" spellcheck="false" style="font-size:16px"></textarea>
      <div class="toolbar" style="margin:12px 0 0"><button class="btn primary" data-k="ok">Vincular</button><button class="btn" data-k="no">Cancelar</button></div>`;
    document.body.appendChild(d);
    code=await new Promise(res=>{ let v=null;
      d.addEventListener("click",e=>{ const k=e.target.closest("[data-k]"); if(!k) return;
        if(k.dataset.k==="ok"){ v=linkCodeOf(d.querySelector("textarea").value); if(!v){ alert("Eso no parece un enlace de vinculación. Cópialo entero desde el otro dispositivo."); return; } }
        d.close(); });
      d.addEventListener("close",()=>{ d.remove(); res(v); });
      d.showModal(); d.querySelector("textarea").focus(); });
  }
  if(code) await linkConnect(code);
}
async function cloudFromLink(){   // la app se abre con #vincular=…
  const m=location.hash.match(/^#vincular=([A-Za-z0-9_-]+)$/); if(!m) return false;
  const full=location.href;
  history.replaceState(null,"",location.pathname+location.search);   // se quita el código de la barra de direcciones y del historial
  // En el iPhone, la app de la pantalla de inicio guarda sus datos aparte de Safari: el enlace abierto en Safari no la vincula
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.standalone===false){
    let copied=Promise.reject(); copied.catch(()=>{});
    const k=await choose("📱 ¿Usas la app desde la pantalla de inicio?",
      `<p class="muted" style="margin:0">Esa app guarda sus datos aparte de Safari, así que este enlace no la vincula si se abre aquí. Copia el enlace, abre la app y ve a <b>Ajustes → Pegar enlace de vinculación</b>.</p>`,
      [["copy","Copiar enlace",true],["here","Vincular Safari"],["no","Cancelar"]],
      k=>{ if(k==="copy") copied=navigator.clipboard.writeText(full); });
    if(k==="copy"){ try{ await copied; alert("Copiado. Ahora abre la app desde la pantalla de inicio → Ajustes → Pegar enlace de vinculación."); }catch(_){ prompt("Copia este enlace:",full); } return false; }
    if(k!=="here") return false;   // la app sigue arrancando con normalidad
  }
  return linkConnect(m[1]);
}
async function linkConnect(code){
  if(!(window.crypto&&crypto.subtle)){ alert("Este navegador no permite cifrar en esta dirección. Abre la app desde su dirección https."); return false; }
  let o; try{ o=JSON.parse(b64urlDec(code)); if(o.v!==1||!o.s||!o.i||!o.c) throw 0; }catch(_){ alert("El enlace de vinculación no es válido o está incompleto."); return false; }
  for(let i=0;i<3;i++){
    const pass=await askPass(i?"Contraseña incorrecta: vuelve a escribirla":"Contraseña de cifrado (la misma que en tu otro dispositivo)");
    if(!pass) return false;
    let c; try{ c=JSON.parse(await cloudDecrypt({v:1,salt:o.s,iv:o.i,ct:o.c,iter:PBKDF2_ITER},pass,LINK_AAD)); }
    catch(e){ if(e.code==="pass") continue; alert(e.message); return false; }
    const remember=confirm("¿Recordar la contraseña en este dispositivo?\n\nAceptar = no la vuelve a pedir.\nCancelar = la pedirá cada vez que abras la app.");
    await cloudConnectWith({repo:c.repo,token:c.token,pass,pass2:pass,remember});
    return true;
  }
  alert("Contraseña incorrecta tres veces. Vuelve a intentarlo con el enlace."); return false;
}
function welcomeHtml(){   // solo si este dispositivo está vacío y sin conectar
  if(hasLocalData()||cloud.cfg) return "";
  return `<div class="card flash"><h2>👋 Esta app está vacía en este dispositivo</h2>
    <p class="muted" style="margin:0 0 10px">Tus datos no están en la web: viven en cada dispositivo y, si lo activas, en tu nube cifrada.</p>
    <ul class="muted" style="margin:0 0 12px;padding-left:18px;line-height:1.6">
      <li><b>Si ya la usas en otro dispositivo</b> (por ejemplo, en tu Mac): allí ve a <i>Ajustes → Vincular otro dispositivo → Copiar enlace</i> y aquí pulsa <b>Pegar enlace de vinculación</b>.</li>
      <li><b>Si empiezas de cero</b>: rellena ingresos y partidas, o mira los datos de ejemplo para probar.</li></ul>
    <div class="toolbar"><button class="btn primary" data-a="cloudpaste">📋 Pegar enlace de vinculación</button><button class="btn" data-a="goto-ajustes">Configurar desde cero</button><button class="btn" data-a="demo">Ver datos de ejemplo</button></div></div>`;
}
async function initCloud(){
  if(await cloudFromLink()) return;   // abierta con un enlace de vinculación
  cloud.cfg=cloudLoadCfg(); if(!cloud.cfg){ setCloud("off"); return; }
  if(!(window.crypto&&crypto.subtle)){ setCloud("error",cloudErr("nocrypto","Este navegador no permite cifrar aquí (hace falta una dirección https).")); return; }
  cloud.on=true; setStatus(srv.state); await cloudPull();
}
function cloudCardHtml(){
  const help=`<details class="help"><summary>Cómo configurarlo (una sola vez)</summary><ol style="margin:8px 0 0;padding-left:18px;line-height:1.6">
    <li>En GitHub crea un repositorio <b>privado</b> vacío para los datos, por ejemplo <b>economia-hogar-datos</b>.</li>
    <li><a href="${TOKEN_URL}" target="_blank" rel="noopener"><b>Crea el token en GitHub</b></a>: se abre ya configurado (permiso <i>Contents: Read and write</i> y 1 año). Solo tienes que elegir, en «Repository access», <b>Only select repositories</b> → el repositorio de datos, y pulsar <i>Generate token</i>. Copia el token.</li>
    <li>Pega aquí el repositorio y el token, y elige una <b>contraseña de cifrado</b>. <b>No se puede recuperar</b>: guárdala bien.</li>
    <li>En el móvil (y en cualquier otro dispositivo) repite el paso 3 con el mismo repositorio, token y contraseña.</li></ol></details>`;
  const intro=`<p class="muted">Guarda una copia <b>cifrada</b> de tus datos en un repositorio privado de GitHub para usar la app desde el móvil con el ordenador apagado. Los datos se cifran en el dispositivo con tu contraseña antes de salir: GitHub solo ve texto ilegible.</p>`;
  if(cloud.cfg) return `<div class="card" id="cloudcard"><h2>☁ Sincronización en la nube</h2>${intro}
    <div id="cloudline" style="margin:8px 0">${cloudLineHtml()}</div>
    <div class="toolbar"><button class="btn primary" data-a="cloudlink">📱 Vincular otro dispositivo</button><button class="btn" data-a="cloudsync">Sincronizar ahora</button><button class="btn danger" data-a="clouddisconnect">Desconectar este dispositivo</button></div>
    <div class="hint">El token se guarda solo en este navegador${cloud.cfg.pass?", y la contraseña también (la marcaste como «recordar»)":"; la contraseña se te pedirá al abrir la app"}.</div>${help}</div>`;
  return `<div class="card" id="cloudcard"><h2>☁ Sincronización en la nube</h2>${intro}
    <div class="linkbox">
      <b>¿Ya la usas en otro dispositivo?</b>
      <p class="muted" style="margin:4px 0 10px">Allí ve a <i>Ajustes → Vincular otro dispositivo → Copiar enlace</i>, y aquí pulsa:</p>
      <button class="btn primary" data-a="cloudpaste">📋 Pegar enlace de vinculación</button>
    </div>
    <p style="margin:16px 0 8px"><b>O configúralo desde cero:</b></p>
    <div class="cloudform">
      <label class="f">Repositorio de datos (privado)<input class="txt" id="cloudrepo" placeholder="usuario/economia-hogar-datos" autocomplete="off" autocapitalize="off"></label>
      <label class="f">Token de GitHub · <a href="${TOKEN_URL}" target="_blank" rel="noopener">crear uno ↗</a><input class="txt" id="cloudtoken" type="password" placeholder="github_pat_…" autocomplete="off"></label>
      <label class="f">Contraseña de cifrado (mín. 8)<input class="txt" id="cloudpass" type="password" autocomplete="new-password"></label>
      <label class="f">Repetir contraseña (solo la primera vez)<input class="txt" id="cloudpass2" type="password" autocomplete="new-password"></label>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin:12px 0"><input type="checkbox" id="cloudremember" checked> Recordar la contraseña en este dispositivo (si no, se pedirá cada vez que abras la app)</label>
    <button class="btn primary" data-a="cloudconnect">Conectar y sincronizar</button>${help}</div>`;
}
document.addEventListener("click",e=>{   // pulsar el aviso de la cabecera
  if(e.target.id!=="cloudstatus") return;
  if(cloud.conflict) cloudResolve(); else if(["pass","error","offline"].includes(cloud.state)) cloudPull();
});
function cloudFlush(){ if(cloud.on&&cloud.dirty){ clearTimeout(cloud.t); cloudPush(false,true); } }   // sube ya lo pendiente
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") cloudPull(); else cloudFlush(); });
addEventListener("pagehide",cloudFlush);
addEventListener("online",()=>{ if(cloud.on) cloudPull(); });
addEventListener("hashchange",()=>{ if(location.hash.startsWith("#vincular=")) cloudFromLink(); });   // enlace abierto con la app ya cargada
cloud.cfg=cloudLoadCfg();   // ¿este dispositivo ya está conectado a la nube?
save();   // persiste la migración de ids, si la hubo
render();
setStatus("local");
initServer().finally(initCloud);   // primero el servidor local (si lo hay) y después la nube
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{});   // para abrir la app sin conexión

/* Actualización automática: la web publicada incluye version.json. Al volver a la app (iOS no la recarga sola),
   si hay versión nueva se recarga; los datos ya están guardados y lo pendiente de la nube se sube al arrancar. */
// APP_VER lo rellena publicar-web.sh con la misma huella que version.json: así la app sabe qué versión tiene cargada
const APP_VER="fadf9f75e5cced3b";
const appVer={cur:APP_VER.startsWith("__")?null:APP_VER,checked:0};
async function checkUpdate(){
  if(location.protocol!=="https:"||Date.now()-appVer.checked<30000) return;
  appVer.checked=Date.now();
  try{
    const r=await fetch("version.json",{cache:"no-store"}); if(!r.ok) return;
    const v=(await r.json()).v; if(!v) return;
    if(appVer.cur===null){ appVer.cur=v; return; }
    if(v!==appVer.cur&&!document.querySelector("dialog[open]")&&!cloud.busy){
      // evita bucles: como mucho un intento de recarga por versión (por si alguna caché sirviera aún la antigua)
      let tried=""; try{ tried=sessionStorage.getItem("eh-reload")||""; }catch(_){}
      if(tried===v) return;
      try{ sessionStorage.setItem("eh-reload",v); }catch(_){}
      cloudFlush(); setTimeout(()=>location.reload(),cloud.dirty?1500:0);
    }
  }catch(_){}
}
checkUpdate();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") checkUpdate(); });
</script>
