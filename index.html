<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Seguridad: la página solo puede hablar con su propio origen y con la API de GitHub (nada de terceros) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Economía del Hogar</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Economía">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --ink:#000000; --muted:#6e6e73; --line:#e5e5ea;
  --accent:#248a3d; --accent-ink:#ffffff; --soft:#e4f3e8; --stripe:#f7f7fa; --line2:#d1d1d6;
  --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08); --glass:rgba(255,255,255,.72); --seg:#ffffff;
  --inc:#248a3d; --exp:#c93400; --sav:#0071e3;
  --ok:#248a3d; --warn:#b25000; --bad:#d70015;
  --c1:#34c759; --c2:#007aff; --c3:#ff9500; --c4:#af52de; --c5:#ffcc00; --c6:#30b0c7; --c7:#ff2d55; --c8:#5856d6; --c9:#8e8e93;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --muted:#98989f; --line:#38383a;
    --accent:#30d158; --accent-ink:#000000; --soft:#14301d; --stripe:#232325; --line2:#48484a;
    --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16); --glass:rgba(30,30,32,.72); --seg:#636366;
    --inc:#30d158; --exp:#ff9f0a; --sav:#0a84ff;
    --ok:#30d158; --warn:#ffd60a; --bad:#ff453a;
    --c1:#30d158; --c2:#0a84ff; --c3:#ff9f0a; --c4:#bf5af2; --c5:#ffd60a; --c6:#40c8e0; --c7:#ff375f; --c8:#5e5ce6; --c9:#98989d;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1c1c1e; --ink:#ffffff; --muted:#98989f; --line:#38383a;
  --accent:#30d158; --accent-ink:#000000; --soft:#14301d; --stripe:#232325; --line2:#48484a;
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16); --glass:rgba(30,30,32,.72); --seg:#636366;
  --inc:#30d158; --exp:#ff9f0a; --sav:#0a84ff;
  --ok:#30d158; --warn:#ffd60a; --bad:#ff453a;
  --c1:#30d158; --c2:#0a84ff; --c3:#ff9f0a; --c4:#bf5af2; --c5:#ffd60a; --c6:#40c8e0; --c7:#ff375f; --c8:#5e5ce6; --c9:#98989d;
}
*{box-sizing:border-box}
/* Estilo según las guías de Apple (Human Interface Guidelines): colores y tipografía del sistema,
   superficies agrupadas, controles rellenos y, en el iPhone, barra de pestañas abajo y título grande. */
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,select,input,textarea,a{touch-action:manipulation}   /* sin la espera del doble toque */
/* el desenfoque va en una capa aparte: en la propia cabecera haría que la barra de pestañas (fija) se colocase dentro de ella */
header{position:sticky;top:0;z-index:5;border-bottom:.5px solid var(--line2);padding-top:env(safe-area-inset-top)}
header::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);transition:opacity .2s}
.bar{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;margin-right:auto;letter-spacing:-.01em}
.navtitle{display:none}
nav{display:flex;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav svg{display:none}
.sh{display:none}   /* textos cortos (.sh) que sustituyen a los largos (.lg) en el móvil */
.mpick{display:inline-flex;align-items:center;background:var(--fill);border-radius:10px}
.mpick>*{background-color:transparent!important}
.mpick select{padding-left:8px;padding-right:26px;background-position:calc(100% - 13px) 52%,calc(100% - 8px) 52%}
.mpick .btn{padding:8px 12px}
.brk{display:none}
nav button{border:0;background:none;color:var(--muted);padding:7px 14px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap;flex:0 0 auto}
.ltitle{display:none}
@media(max-width:720px){   /* iPhone: barra de pestañas flotante abajo y título grande arriba, como las apps de iOS */
  body{font-size:16px}
  .bar{padding:6px 16px;min-height:44px;gap:6px 10px;justify-content:flex-end;position:relative}
  .brand{display:none}
  .navtitle{display:block;position:absolute;left:50%;transform:translateX(-50%);font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
  /* cabecera opaca: con fondos translúcidos iOS 26 añade su propio desenfoque en los bordes de la pantalla */
  header{background:var(--bg);border-bottom-color:transparent;transition:border-color .2s}
  header::before{display:none}
  header.scrolled{border-bottom-color:var(--line2)}
  /* bajo la barra de pestañas, el contenido se funde con el fondo en vez de verse a medias */
  body::after{content:"";position:fixed;z-index:4;left:0;right:0;bottom:0;height:calc(max(env(safe-area-inset-bottom),24px) + 84px);pointer-events:none;
    background:linear-gradient(to bottom,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 45%)}
  header.scrolled .navtitle{opacity:1}
  /* en el iPhone el estado de guardado/sincronización va en la línea del título grande (.ltstat) */
  header #status,header #cloudstatus{display:none}
  .ltitle{display:flex!important;align-items:center;justify-content:space-between;gap:8px}
  .ltitle>span:first-child{white-space:nowrap}
  .ltstat{font-size:13px;font-weight:500;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;cursor:pointer}
  .bar{min-height:40px}
  .ltstat:empty{display:none}
  .ltitle{display:block;font-size:34px;line-height:1.2;font-weight:700;letter-spacing:.01em;margin:0 4px 12px}
  nav{position:fixed;z-index:20;left:12px;right:12px;bottom:max(calc(env(safe-area-inset-bottom) + 6px),30px);justify-content:space-around;gap:0;padding:6px;
      border-radius:999px;overflow:visible;border:0}
  nav.glass{box-shadow:var(--g-edge),0 10px 30px rgba(0,0,0,.14),0 1px 3px rgba(0,0,0,.08)}
  nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px 5px;min-height:50px;font-size:10px;font-weight:600;color:var(--muted)}
  nav svg{display:block;width:24px;height:24px}
  #nav button.on{color:var(--accent)}
  .lg{display:none} .sh{display:inline}
  /* barra del mes compacta: [‹ Octubre 2026 ›] [Hoy] y debajo el resto, con controles más bajos */
  .toolbar{gap:8px;margin-bottom:12px}
  .toolbar .brk{display:block;flex-basis:100%;height:0}
  .toolbar .mpick{flex:1 1 auto;justify-content:space-between}
  .toolbar button.btn,.toolbar select{min-height:36px;padding-top:5px;padding-bottom:5px;font-size:15px}
  .toolbar select{font-size:16px!important}
  .toolbar .seg button{min-height:32px;padding:4px 12px}
  main{padding-bottom:calc(max(env(safe-area-inset-bottom),24px) + 96px)!important}
  /* «Datos del mes» en móvil: sin columna «Dif.» y con campos más compactos para que se lean los importes enteros */
  .dt th:nth-child(4),.dt td:nth-child(4){display:none}
  .dt td.n{width:88px;min-width:88px}
  .dt input.num{padding:6px 6px}
  .dt td:first-child{padding-right:6px}
  td .dueinfo{white-space:normal}   /* «Próximo cobro: …» pasa a dos líneas en vez de ensanchar la tabla */
  /* iPhone amplía la página al tocar un campo con letra de menos de 16 px */
  input,select,textarea{font-size:16px!important}
  main{padding:4px 16px}
  .card{padding:16px}
  button.btn,select,input[type=month]{min-height:44px}   /* zona táctil mínima de 44 pt */
  .seg button{min-height:36px}
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}   /* sin letra agrandada al girar el móvil */
nav button.on{color:var(--ink)}
/* ---------- Liquid Glass (aproximación web) ----------
   Vidrio: fondo muy translúcido + desenfoque con saturación + borde especular (luz arriba, sombra abajo).
   Movimiento: «muelle» con un pequeño rebote, como en iOS 26. */
:root{--spring:cubic-bezier(.34,1.45,.64,1);--g-tint:rgba(255,255,255,.55);--g-lens:rgba(255,255,255,.75);
  --g-edge:inset 0 1px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(0,0,0,.06),inset 0 0 0 .5px rgba(0,0,0,.08)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--g-tint:rgba(40,40,44,.55);--g-lens:rgba(255,255,255,.14);
  --g-edge:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.12)}}
:root[data-theme="dark"]{--g-tint:rgba(40,40,44,.55);--g-lens:rgba(255,255,255,.14);
  --g-edge:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.12)}
.glass{background:var(--g-tint);-webkit-backdrop-filter:blur(16px) saturate(190%) brightness(1.04);backdrop-filter:blur(16px) saturate(190%) brightness(1.04);box-shadow:var(--g-edge)}
@media(min-width:721px){nav{position:relative} nav.glass{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none}}
nav button{position:relative;z-index:1;transition:color .25s,transform .35s var(--spring)}
nav button:active{transform:scale(.92)}
/* la «lente» que marca la pestaña activa y se desliza entre pestañas */
.navpill{position:absolute;z-index:0;top:0;left:0;height:0;border-radius:999px;pointer-events:none;background:var(--fill);
  transition:transform .45s cubic-bezier(.3,1.1,.5,1),width .45s cubic-bezier(.3,1.1,.5,1),scale .4s var(--spring),box-shadow .3s}
/* arrastrando: la lente crece y se estira con la velocidad, como una gota de agua */
.navpill.noanim{transition:scale .12s linear,box-shadow .3s}
.navpill.drag{box-shadow:var(--g-edge),0 8px 22px rgba(0,0,0,.2)!important}
nav button.peek{color:var(--accent)!important}
.navpill.noanim{transition:none}
.navpill{display:none}   /* sin lente deslizante: la pestaña activa se marca directamente */
nav button.on{background:var(--fill)}
@media(max-width:720px){#nav button.on{background:var(--g-lens);box-shadow:var(--g-edge),0 2px 8px rgba(0,0,0,.08)}
  nav{-webkit-user-select:none;user-select:none}}
/* botones y controles: ceden al pulsar y vuelven con muelle */
button.btn,.seg button,.mpick .btn{transition:transform .35s var(--spring),background-color .2s,filter .2s}
button.btn:active,.seg button:active{transform:scale(.95);opacity:1}
.seg button.on{box-shadow:var(--g-edge),0 3px 8px rgba(0,0,0,.12)}
button.primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.12)}
/* hojas y ventanas: vidrio y entrada con rebote */
dialog{box-shadow:var(--g-edge),0 20px 60px rgba(0,0,0,.25)}
dialog[open]{animation:sheetin .5s var(--spring)}
dialog[open]::backdrop{animation:fadein .3s ease}
@keyframes sheetin{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}}
/* cambio de pestaña: el contenido entra suavemente */
#app.enter{animation:pagein .35s cubic-bezier(.2,.8,.2,1)}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}}
/* sin animaciones: todo cambia al instante */
*,*::before,*::after{animation:none!important;transition:none!important}
button:active{transform:none!important}
@media (prefers-reduced-transparency: reduce){.glass,nav.glass{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}}
main{max-width:1180px;margin:0 auto;padding:16px}
h2{font-size:17px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:13px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.side{position:sticky;top:72px}
@media(max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}.side{position:static}}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
button.btn,select,input[type=month]{font:inherit;border:0;background-color:var(--fill);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
button.btn{color:var(--accent);font-weight:500}
select{-webkit-appearance:none;appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
@media(hover:hover){button.btn:hover{filter:brightness(.96)}}
button.btn:active{opacity:.6}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
button.danger{color:var(--bad)}
button.icon{padding:6px 10px}
input.num,input.txt,textarea,select.sm{font:inherit;color:var(--ink);background-color:var(--fill2);border:0;border-radius:8px;padding:7px 9px;width:100%}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.7}
input.num{text-align:right;font-variant-numeric:tabular-nums}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input:focus,textarea:focus{background-color:var(--card)}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);text-align:right;font-weight:600;padding:4px 6px}
th:first-child,td:first-child{text-align:left}
td{padding:4px 4px;border-top:.5px solid var(--line2)}
td.n{width:124px}
td.d{width:112px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-variant-numeric:tabular-nums}
.row.big{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.muted{color:var(--muted);font-size:13px}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border-radius:16px;padding:14px 16px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:ui-rounded,-apple-system,sans-serif;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.meter{margin:10px 0}
.meter .top{display:flex;justify-content:space-between;font-size:13px}
.track{height:8px;background:var(--fill);border-radius:999px;position:relative;overflow:hidden;margin-top:6px}
.fill{height:100%;border-radius:999px}
.tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ins{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}
svg text{fill:var(--muted);font-size:11px}
@media(max-width:720px){svg text{font-size:19px}}   /* las gráficas se ven a la mitad de tamaño en el iPhone */
svg .grid line{stroke:var(--line)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
/* --- Ajustes: tarjetas de partida con panel de opciones --- */
.catitem{--g:var(--line);background:var(--card);border:0;border-left:4px solid var(--g);border-radius:12px;margin-bottom:8px;transition:box-shadow .15s}
.catitem[data-g=need]{--g:var(--sav)}
.catitem[data-g=want]{--g:var(--exp)}
.catitem[data-g=save]{--g:var(--accent)}
@media(hover:hover){.catitem:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}}
.catitem.open{box-shadow:0 6px 22px rgba(0,0,0,.10)}
.catitem.over{outline:2px dashed var(--accent);outline-offset:2px}
.catitem.dragging{opacity:.4}
.famhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 8px;padding:8px 12px;border-radius:12px;background:var(--soft);border:1px dashed transparent}
.famhead:first-child{margin-top:4px}
.famhead.over,.famlist.over{border-color:var(--accent);outline:2px dashed var(--accent);outline-offset:2px;border-radius:10px}
.famhead .famname{flex:1 1 220px;max-width:340px;font-weight:700;font-size:15px;background:transparent!important;border-color:transparent!important}
.famhead .famname:hover,.famhead .famname:focus{background:var(--card)!important;border-color:var(--line)!important}
.famname-static{font-weight:700;font-size:15px;color:var(--muted)}
.famact{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.famempty{padding:14px;font-size:13px;border:1px dashed var(--line2);border-radius:10px}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:10px;background:var(--fill);vertical-align:middle}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--seg);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
tr.famrow td{background:var(--soft);font-weight:700;font-size:13px;padding:7px 8px;border-top:2px solid var(--line)}
tr.famrow td:not(:first-child){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.catitem{margin-bottom:10px;box-shadow:0 0 0 .5px var(--line2)}
.catitem:nth-child(odd){background:var(--stripe)}
@media(hover:hover){.catitem:hover{background:var(--soft)}}
.catitem:focus-within{box-shadow:0 0 0 1.5px var(--accent),0 6px 18px rgba(0,0,0,.08)}
.catitem.open{background:var(--card);box-shadow:0 0 0 1.5px var(--accent),0 8px 24px rgba(0,0,0,.10)}
.rowno{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--g);color:var(--accent-ink);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.goalcard:nth-of-type(odd),.rulecard:nth-of-type(odd){background:var(--stripe)}
.goalcard,.rulecard{border-left-color:var(--accent)}
.cathead{display:flex;align-items:center;gap:10px;padding:10px 12px}
.cmain{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}   /* nombre + etiquetas: las etiquetas bajan a otra línea si no caben */
@media(max-width:720px){   /* móvil: arriba nombre y etiquetas; debajo, importe y Opciones */
  /* fila tipo lista de iOS: nº | nombre y etiquetas | importe arriba y «Opciones» debajo */
  .cathead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"no main amt" "no main opt";gap:2px 8px;padding:8px 10px 6px}
  .cathead .rowno{width:20px;height:20px;font-size:10.5px}
  .cathead .grip{display:none}
  .cathead .rowno{grid-area:no}
  .cathead .cmain{grid-area:main;display:block}
  .cathead .catname{padding:2px 0!important;min-height:0;width:100%}
  .cathead .chips{margin-top:3px;gap:4px}
  .cathead .chip{font-size:11px;padding:3px 6px}
  .cathead .amt{grid-area:amt}.cathead .amt small{display:none}.cathead .amt input{width:96px;padding:5px 8px}
  .cathead [data-a=togglecat]{grid-area:opt;justify-self:end;min-height:0!important;padding:2px 2px 0;font-size:13px}
  .famlist .catitem{margin-bottom:6px}
  .famhead{margin:16px 0 6px;padding:8px 10px;gap:6px 8px}
  .famhead .famname{flex:1 1 0;min-width:0;font-size:16px}

<script>
"use strict";
/* ---------- Modelo ---------- */
const KEY = "economia-hogar-v1";
/* Cada gasto tiene dos etiquetas independientes:
   · group: need (Esencial) / want (Capricho)  — save = destino del ahorro
   · fixed: true = cargo fijo que se cobra sí o sí; false = variable */
const GROUPS = {need:"Esencial", want:"Capricho", save:"Ahorro e inversión"};
const FIXED_SLUGS = ["vivienda","internet","comunidad","seguros","deuda","educacion","suscripciones"];
/* NOMBRES: en la interfaz, «categoría» = cada grupo del nivel alto (Vivienda, Seguros, Préstamos, Suscripciones…; en el código «family», editables)
   y «partida» = cada línea de presupuesto (Hipoteca, Luz, Netflix…; en el código «cat»). Los comentarios antiguos que dicen «grupo» se refieren a la categoría. */
const FAMILY_DEFS=[
  ["f_vivienda","Vivienda",["vivienda","comunidad","hogar"]],
  ["f_suministros","Suministros y comunicaciones",["suministros","internet"]],
  ["f_alimentacion","Alimentación",["super","restaurantes"]],
  ["f_transporte","Transporte",["transporte"]],
  ["f_salud","Salud y cuidado personal",["salud","personal"]],
  ["f_seguros","Seguros",["seguros"]],
  ["f_prestamos","Préstamos y deudas",["deuda"]],
  ["f_educacion","Educación",["educacion"]],
  ["f_suscripciones","Suscripciones",["suscripciones"]],
  ["f_ocio","Ocio y viajes",["ocio","viajes"]],
  ["f_ropa","Ropa y compras",["ropa"]],
  ["f_otros","Imprevistos y otros",["otros"]],
  ["f_ahorro","Ahorro e inversión",["emergencia","inversion","pension","metas"]]];
const DEFAULT_FAMILIES=FAMILY_DEFS.map(([id,name])=>({id,name}));
const ROLE_FAMILY={}; FAMILY_DEFS.forEach(([id,,roles])=>roles.forEach(r=>ROLE_FAMILY[r]=id));
const DEFAULT_CATS = [
  ["vivienda","Hipoteca / alquiler","need",800],["suministros","Luz, agua y gas","need",130],
  ["internet","Internet y móviles","need",55],["comunidad","Comunidad e impuestos (IBI…)","need",60],
  ["super","Supermercado","need",450],["transporte","Transporte y coche","need",150],
  ["salud","Salud","need",40],["seguros","Seguros","need",70],["deuda","Cuotas de préstamos","need",0],

function uid(){
  if(crypto.randomUUID) return crypto.randomUUID();
  const b=crypto.getRandomValues(new Uint8Array(16)); b[6]=b[6]&15|64; b[8]=b[8]&63|128;
  const h=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

function migrate(d){

    if(UUID_RE.test(c.id)) continue;
    const old=c.id; c.id=uid(); map[old]=c.id;
    if(!c.role && DEFAULT_ROLES.includes(old)) c.role=old;
  }
  if(!Array.isArray(d.incomeDefaults)){   // ingresos por defecto = los del último mes con ingresos
    const last=Object.keys(d.months).sort().reverse().map(k=>d.months[k].income).find(a=>a&&a.length);
    d.incomeDefaults=last?last.map(i=>({id:uid(),name:i.name,amount:i.amount||0})):[];
  }
  for(const m of Object.values(d.months)){
    if(m.income===undefined) m.income=null;
    if(!Array.isArray(m.tx)) m.tx=[];
    if(m.income) m.income.forEach(i=>i.id=safeId(i.id));
    m.tx.forEach(t=>t.id=safeId(t.id));
  }
  d.incomeDefaults.forEach(i=>i.id=safeId(i.id));
  if(!Array.isArray(d.goals)) d.goals=[];
  if(!Array.isArray(d.rules)) d.rules=[];
  if(!Array.isArray(d.families)) d.families=structuredClone(DEFAULT_FAMILIES);
  d.families.forEach(f=>f.id=safeId(f.id));
  for(const c of d.cats){   // cada partida pertenece a un grupo (o a ninguno)
    if(c.family===undefined) c.family=ROLE_FAMILY[c.role]||null;
    if(c.family&&!d.families.some(f=>f.id===c.family)) c.family=null;
  }
  d.goals.forEach(g=>g.id=safeId(g.id)); d.rules.forEach(r=>r.id=safeId(r.id));
  for(const c of d.cats){ if(c.fixed===undefined) c.fixed = c.group!=="save" && FIXED_SLUGS.includes(c.role); if(!c.period) c.period=c.annual?"year":"month"; c.annual=c.period!=="month"; if(c.day===undefined) c.day=null; if(c.chargeMonth===undefined) c.chargeMonth=null; }
  if(Object.keys(map).length) for(const m of Object.values(d.months)){
    for(const f of ["real","budget"]){ const n={}; for(const [k,v] of Object.entries(m[f]||{})) n[map[k]||k]=v; m[f]=n; }
  }
  // lo cobrado/gastado sale solo de «Movimientos»: los importes escritos a mano pasan a ser movimientos (sin cambiar los totales)
  for(const [k,m] of Object.entries(d.months)){
    for(const [cid,v] of Object.entries(m.real||{})){
      const c=d.cats.find(c=>c.id===cid);
      if(c&&v>0&&!m.tx.some(t=>t.cat===cid)){
        const dd=Math.min(c.day||1,new Date(+k.slice(0,4),+k.slice(5,7),0).getDate());
        m.tx.push({id:uid(),date:`${k}-${String(dd).padStart(2,"0")}`,desc:"Apuntado a mano",cat:cid,amount:v});
      }
    }
    m.real={};
  }
  return d;
}

function totals(k){
  const m=getM(k), t={income:sum(incomeOf(m).map(i=>i.amount||0)),need:0,want:0,save:0,bneed:0,bwant:0,bsave:0,
    fixed:0,variable:0,bfixed:0,bvariable:0,fe:0,fc:0,ve:0,vc:0,bfe:0,bfc:0,bve:0,bvc:0,direct:0,prov:0,paidAnnual:0};
  for(const c of S.cats){

    if(c.annual){ if(S.months[k]) t.prov+=c.budget/perN(c); t.paidAnnual+=r; } else t.direct+=r;   // prov = parte mensual reservada (informativa)
    t[c.group]+=r; t["b"+c.group]+=b;
    if(c.group!=="save"){
      const f=c.fixed?"fixed":"variable"; t[f]+=r; t["b"+f]+=b;
      const q=(c.fixed?"f":"v")+(c.group==="need"?"e":"c"); t[q]+=r; t["b"+q]+=b;   // matriz fijo/variable × esencial/capricho (real y presupuestada)

  t.unassigned=t.saving-t.save; t.bexp=t.bneed+t.bwant;
  // lo mismo calculado con el dinero presupuestado
  t.bsaving=t.income-t.bexp; t.brate=t.income>0?t.bsaving/t.income*100:0; t.bmargin=t.income-t.bfixed; t.bunassigned=t.bsaving-t.bsave;

  // (las provisiones de gastos anuales se generan solas y tampoco cuentan)
  t.has = (m.income!==null && t.income>0) || t.direct>0 || t.paidAnnual>0 || t.save>0;
  const b=m.bal; t.assets=(b.cash||0)+(b.invest||0)+(b.other||0); t.net=t.assets-(b.debt||0); t.hasBal=!!m.hasBal;

}

  }
  const closeBanner=isCur&&now.getDate()>=dim-4&&!m.hasBal?`<button class="card cbanner" data-a="mesgo" data-v="d-saldos">🗓️ Cierra ${monthLabel(k).split(" ")[0]}: apunta los saldos y notas ›</button>`:"";
  const hero=`<div class="card hero">
    <div class="hero-l">${P.left>=0?"Te quedan":"Te pasas"}</div>
    <div class="hero-v ${P.left<0?"neg":""}">${eur(Math.abs(P.left),0)}</div>
    <div class="hero-l">${P.left>=0?(isCur?`para gastar hasta el ${dim}`:`para gastar en ${monthLabel(k).split(" ")[0]}`):"sobre tus ingresos este mes"}</div>
    ${pace}
    <button class="hero-inc" data-a="mesgo" data-v="d-ingresos">Ingresos ${eur(P.inc)} ›</button></div>`;
  // 2) por cobrar
  const row=(c,done)=>{
    const exp=expectedOf(m,c), sp=spent(m,c), diff=done?sp-exp:0, ntx=hasTx(m,c);
    const mon=c.annual?`<small>${monthLabel(k,true).replace(".","").slice(0,3)}</small>`:"";
    return `<div class="frow ${done?"done":""}">
      <span class="dday">${c.day||"–"}${mon}</span>
      <button class="fname" data-a="sedit" data-id="${c.id}">${esc(c.name)}${c.annual?`<small>${c.period==="quarter"?"Trimestral":"Anual"}</small>`:""}${done&&Math.abs(diff)>0.004?`<small class="${diff>0?"neg":"pos"}">${diff>0?"+":"−"}${eur(Math.abs(diff))} sobre lo previsto</small>`:""}</button>
      <button class="famt" data-a="sedit" data-id="${c.id}">${eur(done?sp:exp)}</button>
      <button class="chk ${done?"on":""}" data-a="smark" data-id="${c.id}" aria-label="${done?"Desmarcar":"Marcar como cobrado"}">${done?"✓":""}</button></div>`;
  };
  const pend=P.fixed.filter(c=>!paid(c)), done=P.fixed.filter(paid);
  let pendHtml="", hoyPuesto=!isCur;
  let sinDia=false;
  for(const c of pend){
    if(!hoyPuesto&&c.day&&c.day>=now.getDate()){ pendHtml+=`<div class="hoy">Hoy, ${now.getDate()}</div>`; hoyPuesto=true; }
    if(!c.day&&!sinDia){ if(!hoyPuesto){ pendHtml+=`<div class="hoy">Hoy, ${now.getDate()}</div>`; hoyPuesto=true; } pendHtml+=`<div class="hoy nodia">Sin día fijo</div>`; sinDia=true; }
    pendHtml+=row(c,false);
  }
  if(!hoyPuesto&&pend.length) pendHtml+=`<div class="hoy">Hoy, ${now.getDate()}</div>`;
  const doneHtml=done.length?`<button class="fdone" data-a="sdone">${ui.showDone?"▾":"▸"} ${done.length} cobrado${done.length>1?"s":""} · ${eur(sum(done.map(c=>spent(m,c))))}</button>${ui.showDone?done.map(c=>row(c,true)).join(""):""}`:"";
  const fixedCard=P.fixed.length?`<div class="card slist"><h3 class="shead">Por cobrar <span>${eur(sum(pend.map(c=>expectedOf(m,c))))}</span></h3>
    ${pendHtml||`<div class="sempty">Todo cobrado este mes ✓</div>`}${doneHtml}</div>`:"";
  // 3) sobres
  const env=P.vars.map(c=>({c,b:budgetOf(m,c),s:spent(m,c)})).filter(x=>x.b>0||x.s>0)
    .sort((a,b)=>(b.b?b.s/b.b:9)-(a.b?a.s/a.b:9));
  const envHtml=env.map(({c,b,s})=>{
    const r=b-s, p=b?Math.min(100,s/b*100):100, col=s>b?"var(--bad)":p>=85?"var(--warn)":"var(--accent)";
    return `<button class="env" data-a="sadd" data-id="${c.id}">
      <span class="env-n">${esc(c.name)}</span>
      <span class="env-r ${r<0?"neg":""}">${s<=0?`${eur(b,0)} disponibles`:r>=0?`quedan ${eur(r,0)}`:`te pasas ${eur(-r,0)}`}</span>
      <span class="track"><span class="fill" style="width:${p}%;background:${col}"></span></span></button>`;
  }).join("");
  const varCard=env.length?`<div class="card slist"><h3 class="shead">Gastos del mes <span>${eur(vs,0)} de ${eur(vb,0)}</span></h3>${envHtml}
    <div class="hint">Toca una partida para apuntar un gasto en ella.</div></div>`:"";
  // 4) ahorro
  const saveCard=P.saves.length?`<div class="card slist"><h3 class="shead">Ahorro <span>${eur(sum(P.saves.map(c=>spent(m,c))))} de ${eur(sum(P.saves.map(c=>budgetOf(m,c))))}</span></h3>
    ${P.saves.map(c=>row(c,paid(c))).join("")}</div>`:"";
  // 5) apartado anual
  const provSum=sum(P.prov.map(c=>budgetOf(m,c)));
  const provCard=P.prov.length?`<div class="card slist"><button class="prov" data-a="sprov"><span>Apartado para pagos anuales</span><b>${eur(provSum)}/mes ${ui.showProv?"▾":"▸"}</b></button>
    ${ui.showProv?P.prov.slice().sort((a,b)=>(nextDue(a,k)||"9").localeCompare(nextDue(b,k)||"9")).map(c=>{ const n=nextDue(c,k);
      return `<div class="prow"><span>${esc(c.name)}</span><span class="muted">${n?monthLabel(n,true).replace(".","").slice(0,3)+" · ":""}${eur(c.budget)}</span></div>`; }).join("")
      +`<div class="hint">Cada mes se reserva su parte; aparecen en «Por cobrar» el mes en que se cobran.</div>`:""}</div>`:"";
  return `<div class="msimple">${monthBar(mesToggle("simple"))}${welcomeHtml()}${closeBanner}${hero}${fixedCard}${varCard}${saveCard}${provCard}
    <div class="fabwrap"><button class="btn primary fab" data-a="sadd" aria-label="Apuntar gasto">＋ Gasto</button></div></div>`;
}
/* --- aviso inferior con «Deshacer» --- */
function toast(msg,undo){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const d=document.createElement("div"); d.className="toast"; d.setAttribute("role","status");
  d.innerHTML=`<span>${esc(msg)}</span>${undo?`<button class="linkbtn">Deshacer</button>`:""}`;
  document.body.appendChild(d);
  if(undo) d.querySelector("button").onclick=()=>{ undo(); d.remove(); };
  setTimeout(()=>d.remove(),5000);
}
function smark(id){   // ✓ = se cobró lo previsto: se crea el movimiento (lo cobrado sale siempre de «Movimientos»)
  const c=S.cats.find(c=>c.id===id); if(!c) return;
  const k=ui.month, m=ensureM(k), mine=m.tx.filter(t=>t.cat===id);
  if(mine.length>1){ sheetEdit(id); return; }   // varios movimientos: mejor verlos
  if(mine.length===1){   // desmarcar = quitar su movimiento
    const t=mine[0]; m.tx=m.tx.filter(x=>x!==t); save(); render();
    toast(`${c.name}: quitado el cobro de ${eur(t.amount)}`,()=>{ ensureM(k).tx.push(t); save(); render(); });
    return;
  }
  const dd=Math.min(c.day||new Date().getDate(),daysOf(k));
  const t={id:uid(),date:`${k}-${String(dd).padStart(2,"0")}`,desc:c.name,cat:id,amount:expectedOf(m,c)};
  m.tx.push(t); save(); render();
  toast(`${c.name} cobrada · ${eur(t.amount)}`,()=>{ const mm=ensureM(k); mm.tx=mm.tx.filter(x=>x!==t); save(); render(); });
}
/* --- hojas (ventanas inferiores) --- */
function sheet(html,onReady){
  const d=document.createElement("dialog"); d.className="sheet"; d.innerHTML=html; document.body.appendChild(d);
  d.addEventListener("close",()=>d.remove()); d.showModal(); if(onReady) onReady(d); return d;
}
function topCats(n){   // partidas variables más usadas en los últimos 3 meses (para los atajos)
  const cnt={}; for(let i=0;i<3;i++){ for(const t of (getM(shiftMonth(ui.month,-i)).tx||[])) cnt[t.cat]=(cnt[t.cat]||0)+1; }
  return S.cats.filter(c=>c.group!=="save"&&!c.annual&&!c.fixed).sort((a,b)=>(cnt[b.id]||0)-(cnt[a.id]||0)||(b.budget-a.budget)).slice(0,n);
}
function sheetAdd(preset,amount){
  const k=ui.month, today=new Date().toISOString().slice(0,10), date=today.slice(0,7)===k?today:k+"-"+String(Math.min(new Date().getDate(),daysOf(k))).padStart(2,"0");
  const tops=topCats(6); if(preset&&!tops.some(c=>c.id===preset)){ const c=S.cats.find(c=>c.id===preset); if(c) tops.unshift(c); }
  sheet(`<h3>Apuntar gasto</h3>
    <input class="num bigamt" id="sa-amt" inputmode="decimal" placeholder="0,00 €" aria-label="Importe" autocomplete="off" value="${amount?showNum(amount):""}">
    <div class="chips sa-chips">${tops.map(c=>`<button class="chip pick ${c.id===preset?"on":""}" data-c="${c.id}">${esc(c.name)}</button>`).join("")}</div>
    <select class="sm" id="sa-cat" aria-label="Partida">${catOptions(preset||"","Otra partida…")}</select>
    <div class="sa-row"><input class="txt" id="sa-desc" placeholder="Descripción (opcional)" aria-label="Descripción"><input class="txt" type="date" id="sa-date" value="${date}" aria-label="Fecha"></div>
    <div class="toolbar" style="margin:14px 0 0"><button class="btn primary" data-k="ok">Guardar</button><button class="btn" data-k="no">Cancelar</button></div>`,d=>{
    const sel=d.querySelector("#sa-cat");
    const pick=id=>{ sel.value=id; d.querySelectorAll(".pick").forEach(b=>b.classList.toggle("on",b.dataset.c===id)); };
    d.addEventListener("click",e=>{
      const p=e.target.closest(".pick"); if(p){ pick(p.dataset.c); return; }
      const b=e.target.closest("[data-k]"); if(!b) return;
      if(b.dataset.k==="no"){ d.close(); return; }
      const amount=parseNum(d.querySelector("#sa-amt").value), cat=sel.value, dt=d.querySelector("#sa-date").value, desc=d.querySelector("#sa-desc").value.trim();
      if(!(amount>0)){ alert("Escribe el importe."); return; }
      if(!cat){ alert("Elige la partida."); return; }
      if(!DATE_RE.test(dt)){ alert("La fecha no es válida."); return; }
      const c=S.cats.find(x=>x.id===cat), mk=dt.slice(0,7), m=ensureM(mk);
      const tx={id:uid(),date:dt,desc:desc||(c?c.name:""),cat,amount}; m.tx.push(tx);
      save(); d.close(); ui.month=mk; render();
      toast(`${eur(amount)} en ${c?c.name:"la partida"}`,()=>{ m.tx=m.tx.filter(t=>t!==tx); save(); render(); });
    });
    sel.addEventListener("change",()=>pick(sel.value));
    d.querySelector("#sa-amt").focus();
  });
}
function sheetEdit(id){   // hoja de una partida: sus movimientos del mes (para añadir o quitar) y su previsto
  const c=S.cats.find(c=>c.id===id); if(!c) return;
  const k=ui.month, m=getM(k), exp=expectedOf(m,c);
  const list=(m.tx||[]).filter(t=>t.cat===id).sort((a,b)=>a.date.localeCompare(b.date));
  const sp=sum(list.map(t=>t.amount||0));
  const verb=c.group==="save"?"Apartado":c.fixed||c.annual?"Cobrado":"Gastado";
  sheet(`<h3>${esc(c.name)}</h3>
    <div class="se-sum"><span>${verb} este mes</span><b>${eur(sp)}</b></div>
    <div class="se-list">${list.length?list.map(t=>`<div class="se-tx"><span class="muted">${t.date.slice(8)}/${t.date.slice(5,7)}</span><span class="se-d">${esc(t.desc||"—")}</span><b>${eur(t.amount||0)}</b><button class="btn icon danger sm" data-k="del" data-t="${t.id}" aria-label="Quitar movimiento">✕</button></div>`).join("")
      :`<div class="muted" style="padding:8px 0">Sin movimientos este mes.</div>`}</div>
    <div class="toolbar" style="margin:10px 0 0"><button class="btn primary" data-k="add">＋ Añadir movimiento</button></div>
    ${c.annual?`<div class="hint" style="margin-top:14px">${c.period==="quarter"?"Trimestral":"Anual"}: ${eur(c.budget)} por cobro (se cambia en Ajustes).</div>`
      :`<label class="f" style="margin-top:16px">Previsto este mes<input class="num" id="se-bud" inputmode="decimal" value="${showNum(budgetOf(m,c))}" placeholder="0,00 €"></label>`}
    <div class="toolbar" style="margin:14px 0 0">${c.annual?"":`<button class="btn" data-k="ok">Guardar previsto</button>`}<button class="btn" data-k="no">Cerrar</button></div>`,d=>{
    d.addEventListener("click",e=>{
      const b=e.target.closest("[data-k]"); if(!b) return; const a=b.dataset.k;
      if(a==="no"){ d.close(); return; }
      if(a==="add"){ d.close(); sheetAdd(id,c.fixed||c.annual||c.group==="save"?Math.max(0,exp-sp):0); return; }
      if(a==="del"){
        const mm=ensureM(k), t=mm.tx.find(x=>x.id===b.dataset.t); if(!t) return;
        mm.tx=mm.tx.filter(x=>x!==t); save(); d.close(); render();
        toast(`Quitado ${eur(t.amount)} de ${c.name}`,()=>{ ensureM(k).tx.push(t); save(); render(); });
        return;
      }
      const bud=d.querySelector("#se-bud");
      if(bud&&Math.abs(parseNum(bud.value)-budgetOf(m,c))>0.004) onInput({target:{dataset:{k:"budget",id},value:bud.value}});
      d.close(); render();
    });
  });
}

function pageDatos(){
  if(mesView()==="simple") return pageMesSimple();
  const m=getM(ui.month);
  const inc = incomeOf(m).map(i=>`<tr>
    <td><input class="txt" data-k="incname" data-id="${i.id}" value="${esc(i.name)}" placeholder="Concepto (nómina, …)" aria-label="Concepto"></td>
    <td class="n"><input class="num" inputmode="decimal" data-k="incamt" data-id="${i.id}" value="${showNum(i.amount)}" placeholder="0,00 €" aria-label="Importe"></td>
    <td style="width:36px"><button class="btn icon danger" data-a="delinc" data-id="${i.id}" aria-label="Quitar">✕</button></td></tr>`).join("");
  const SECTIONS=[
    ["fixed","Gastos fijos","Cargos que te van a cobrar sí o sí cada mes","Previsto","Cobrado",c=>c.group!=="save"&&c.fixed],
    ["variable","Gastos variables","Cambian de un mes a otro","Presupuesto","Real",c=>c.group!=="save"&&!c.fixed],
    ["save","Ahorro e inversión","Dinero que apartas este mes","Presupuesto","Real",c=>c.group==="save"]];
  // orden por día de cobro (por defecto) o por grupo, con una fila de subtotales por grupo
  const famBlocks=(cats,fn)=>{
    const sorted=sortByFamily(cats), out=[]; let run=[];
    const flush=()=>{ if(!run.length) return; const fid=run[0].family||null;
      out.push(`<tr class="famrow"><td>${esc(famName(fid))}</td><td>${eur(sum(run.map(c=>budgetOf(m,c))))}</td><td>${eur(sum(run.map(c=>costOf(m,c,ui.month))))}</td><td></td></tr>`); run.forEach(c=>out.push(fn(c))); run=[]; };
    for(const c of sorted){ if(run.length&&(run[0].family||null)!==(c.family||null)) flush(); run.push(c); } flush();
    return out.join("");
  };
  const rowsOf=(cats,fn)=>ui.sortMode==="group"?famBlocks(cats,fn):cats.map(fn).join("");
  const groups = SECTIONS.map(([g,title,sub,hb,hr,pick])=>{
    const cats=sortByDay(S.cats.filter(pick));   // por día de cobro; sin día, al final
    return `<div class="card"><h2>${title} <span class="muted" id="gt-${g}"></span></h2><div class="hint" style="margin:-6px 0 8px">${sub}</div>
    <table class="dt"><thead><tr><th>Partida</th><th>${hb}</th><th>${hr}</th><th>Dif.</th></tr></thead><tbody>
    ${rowsOf(cats,c=>{
      const ntx=(m.tx||[]).filter(t=>t.cat===c.id).length;
      const ro = c.annual ? ` readonly class="num ro" title="Parte mensual reservada: importe de cada cobro (${eur(c.budget)}) ÷ ${perN(c)}. Se cambia en Ajustes. El gasto real cuenta cuando registras el pago."` : ` class="num"`;

      const ovr=!c.annual&&m.budget[c.id]!==undefined&&Math.abs(m.budget[c.id]-c.budget)>0.005;   // el presupuesto de este mes difiere del de Ajustes
      // nombre con un punto de color (esencial/capricho) y debajo, como mucho, una línea gris con día, periodicidad y movimientos

      // a la izquierda, el día de cobro como en un extracto (y el mes del próximo cobro si es trimestral/anual);
      // a la derecha, el nombre y, solo si hace falta, una línea gris (periodicidad e importe de cada cobro, movimientos)
      const now=c.annual&&dueIn(c,ui.month), nd=c.annual&&c.chargeMonth?nextDue(c,ui.month):null;
      const mon=nd?monthLabel(nd,true).replace(".","").slice(0,3):"";   // tres letras («sep»); si toca este mes, sale en verde
      const day=`<span class="dday ${now?"now":""}"${now?' title="Se cobra este mes"':""}>${c.day||(mon?"–":"")}${mon?`<small>${mon}</small>`:""}</span>`;
      const sub2=[c.annual?`${c.period==="quarter"?"Trimestral":"Anual"} · ${eur(c.budget)}`:"",ntx?`${ntx} mov.`:""].filter(Boolean).join(" · ");
      return `<tr><td><div class="pcell">${day}<div><span class="pname">${esc(c.name)}</span>${sub2?`<span class="psub">${esc(sub2)}</span>`:""}</div></div>${ovr?`<span class="dueinfo ovr">Presupuesto ajustado este mes · en Ajustes: ${eur(c.budget)} <button class="linkbtn" data-a="resetbud" data-id="${c.id}">restaurar</button></span>`:""}</td>
      <td class="n"><input${ro} inputmode="decimal" data-k="budget" data-id="${c.id}" value="${showNum(budgetOf(m,c))}" placeholder="0,00 €" aria-label="Presupuesto ${esc(c.name)}"></td>
      <td class="n rshow ${spent(m,c)>0?"":"empty"}" title="Suma de los movimientos de esta partida (se apuntan en «Movimientos»)">${spent(m,c)>0?eur(spent(m,c)):"—"}</td>
      <td class="d" id="df-${c.id}"></td></tr>`;})||`<tr><td colspan="4" class="muted">Sin partidas (añádelas en Ajustes)</td></tr>`}
    </tbody></table></div>`;}).join("");
  return `${monthBar(`${mesToggle("detalle")}<button class="btn" data-a="copyprev" title="Copia los ingresos y los presupuestos del mes anterior; los movimientos y los saldos se dejan vacíos"><span class="lg">Copiar mes anterior</span><span class="sh">Copiar anterior</span></button><span class="seg" role="group" aria-label="Ordenar las partidas"><button class="${ui.sortMode==="group"?"":"on"}" data-a="sortmode" data-v="day"><span class="lg">Orden: día de cobro</span><span class="sh">Por día</span></button><button class="${ui.sortMode==="group"?"on":""}" data-a="sortmode" data-v="group"><span class="lg">Orden: categoría</span><span class="sh">Por categoría</span></button></span>`)}
  ${welcomeHtml()}
  <div class="card msum" id="msum"></div>
  <div class="grid"><div>
    <div class="card" id="d-ingresos"><h2>Ingresos</h2>
      <table><tbody>${inc||`<tr><td class="muted" colspan="3">Añade nóminas, pensiones, ayudas, alquileres, ingresos extra…</td></tr>`}</tbody></table>
      <button class="btn" style="margin-top:8px" data-a="addinc">+ Añadir ingreso</button>
      <div class="hint">Puedes escribir sumas, p. ej. <b>1200+300</b>. Usa coma para decimales. Si cambias los ingresos del mes en curso o de un mes futuro, se aplicarán también a los meses siguientes; los meses pasados no se tocan.</div></div>
    ${calendarHtml(ui.month)}
    ${groups}
    <div class="hint" style="margin:-8px 0 16px">Las partidas con movimientos (pestaña «Movimientos») suman su importe automáticamente. Los pagos trimestrales y anuales figuran en «Presupuesto» por su parte mensual y en «Real» solo cuando los registras. Si cambias un presupuesto del mes en curso o de un mes futuro, se usará también como valor por defecto para los meses siguientes. Los meses pasados no se tocan.</div>
    <div class="card" id="d-saldos"><h2>Saldos a fin de mes</h2>
      <div class="cols3">
        <label class="f">Cuentas y efectivo<input class="num" inputmode="decimal" data-k="bal" data-id="cash" value="${showNum(m.bal.cash)}"></label>
        <label class="f">Inversiones y pensiones<input class="num" inputmode="decimal" data-k="bal" data-id="invest" value="${showNum(m.bal.invest)}"></label>
        <label class="f">Otros activos (vehículo, vivienda…)<input class="num" inputmode="decimal" data-k="bal" data-id="other" value="${showNum(m.bal.other)}"></label>
      </div>
      <label class="f" style="margin-top:8px;max-width:33%;min-width:200px">Deudas pendientes (hipoteca, préstamos, tarjetas)<input class="num" inputmode="decimal" data-k="bal" data-id="debt" value="${showNum(m.bal.debt)}"></label>
      <div class="hint">Sirven para calcular tu patrimonio neto y tu fondo de emergencia en el Panel.</div></div>
    <div class="card"><h2>Notas del mes</h2>
      <textarea rows="3" data-k="note" placeholder="Gastos extraordinarios, decisiones, cosas a revisar…">${esc(m.note)}</textarea></div>
  </div>
  <aside class="side"><div class="card" id="summary"></div></aside></div>`;
}
/* Cobros del mes ordenados por día: solo las partidas con día indicado (las periódicas, solo en su mes de cobro) */
function calendarHtml(k){
  const m=getM(k), now=new Date(), cur=k===curMonth();
  const items=sortByDay(S.cats.filter(c=>c.group!=="save"&&c.day&&(!c.annual||dueIn(c,k))));
  if(!items.length) return "";
  const amt=c=>c.annual?c.budget:budgetOf(m,c);
  return `<div class="card"><h2>Calendario de cobros <span class="muted">· ${eur(sum(items.map(amt)))} previstos</span></h2>
    <table class="mx"><tbody>${items.map(c=>{
      const done=spent(m,c)>0, late=cur&&!done&&c.day<now.getDate();
      return `<tr><td style="width:70px"><b>Día ${c.day}</b></td><td style="text-align:left">${esc(c.name)}${c.annual?` <span class="tag">${c.period==="quarter"?"trimestral":"anual"}</span>`:""}</td>
      <td>${eur(amt(c))}</td><td style="width:150px">${done?`<span class="pos">✓ registrado</span>`:late?`<span class="neg">sin registrar</span>`:`<span class="muted">pendiente</span>`}</td></tr>`; }).join("")}</tbody></table>
    <div class="hint">Solo aparecen los gastos con día de cobro indicado en Ajustes. Los trimestrales y anuales, únicamente en el mes en que se cobran.</div></div>`;
}
function updateSummary(){
  const t=totals(ui.month), m=getM(ui.month), el=document.getElementById("summary"); if(!el) return;
  const cls=n=>n>=0?"pos":"neg";
  // cada fila: etiqueta, valor presupuestado, valor real (null = no aplica), con signo coloreado si sign
  const hasReal=t.direct>0||t.paidAnnual>0||t.save>0;   // sin gastos registrados, el «ahorro real» no tiene sentido (saldría todo el ingreso)
  const pc=r=>t.income>0?r.toFixed(1).replace(".",",")+"%":"—";
  const R=(label,b,r,o={})=>{
    const f=o.fmt||(v=>eur(v,2)), c=(v)=>o.sign&&v!==null?` class="${cls(v)}"`:"";
    return `<tr class="${o.big?"big":""} ${o.sub?"muted":""}"><td>${label}</td><td${c(b)}>${b===null?"—":f(b)}</td><td${c(r)}>${r===null?"—":(o.bold?`<b>${f(r)}</b>`:f(r))}</td></tr>`;
  };
  el.innerHTML=`<h2>Resumen de ${monthLabel(ui.month)}</h2>
    <table class="sum"><thead><tr><th></th><th>Presupuestado</th><th>Real</th></tr></thead><tbody>
    ${R("Ingresos",t.income,t.income,{bold:true})}
    ${R("Gastos fijos",t.bfixed,t.fixed)}
    ${R("Gastos variables",t.bvariable,t.variable)}
    ${R("Total gastos",t.bexp,t.expenses,{bold:true})}
    ${R("· Esenciales",t.bneed,t.need,{sub:true})}
    ${R("· Caprichos",t.bwant,t.want,{sub:true})}
    ${R("Te queda tras los fijos",t.bmargin,hasReal?t.margin:null,{sub:true,sign:true})}
    ${R("Ahorro del mes",t.bsaving,hasReal?t.saving:null,{big:true,sign:true})}
    ${R("Tasa de ahorro",t.brate,hasReal?t.rate:null,{sub:true,sign:true,fmt:pc})}
    ${R("A ahorro/inversión",t.bsave,t.save,{sub:true})}
    ${R("Sin asignar",t.bunassigned,hasReal?t.unassigned:null,{sub:true,sign:true})}
    ${R("Desviación en gastos",null,hasReal?t.bexp-t.expenses:null,{sub:true,sign:true})}
    ${R("Patrimonio neto",null,t.net,{bold:true})}
    </tbody></table>
    <div class="hint"><b>Presupuestado</b>: lo previsto (ingresos − gastos presupuestados). <b>Real</b>: lo registrado hasta ahora. Desviación positiva = gastas menos de lo previsto. Los cambios se guardan automáticamente ${srv.on?"en datos.json":"en este navegador"}.</div>`;
  // resumen breve (solo se ve en el móvil, arriba del todo): lo esencial de un vistazo
  const ms=document.getElementById("msum");
  if(ms){
    const pct=t.bexp>0?Math.min(100,t.expenses/t.bexp*100):0, over=t.expenses>t.bexp;
    ms.innerHTML=`<div class="mrow">
        <div><div class="l">Ingresos</div><div class="v">${eur(t.income,0)}</div></div>
        <div><div class="l">Gastado</div><div class="v ${over?"neg":""}">${eur(t.expenses,0)}</div><div class="s">de ${eur(t.bexp,0)}</div></div>
        <div><div class="l">${hasReal?"Ahorro":"Ahorro previsto"}</div><div class="v ${cls(hasReal?t.saving:t.bsaving)}">${eur(hasReal?t.saving:t.bsaving,0)}</div></div>
      </div>
      <div class="track"><div class="fill" style="width:${pct}%;background:${over?"var(--bad)":"var(--accent)"}"></div></div>
      <button class="linkbtn" data-a="gosum">Ver resumen completo ↓</button>`;
  }
  for(const c of S.cats){
    const d=document.getElementById("df-"+c.id); if(!d) continue;
    const sp=spent(m,c), diff=budgetOf(m,c)-sp, has=!c.annual&&(sp>0||budgetOf(m,c)>0);   // en anuales la diferencia no tiene sentido (se ve en «Anual»)
    d.textContent=has?(diff>=0?"+":"")+eur(diff,2):"";
    d.className="d "+(c.group==="save"?(diff<=0?"pos":""):(diff>=0?"pos":"neg"));
  }
  for(const g of ["fixed","variable","save"]){
    const e=document.getElementById("gt-"+g); if(e) e.textContent="· "+eur(t[g],2)+" de "+eur(t["b"+g],2);
  }
}
function copyPrev(){
  const p=S.months[shiftMonth(ui.month,-1)];
  if(!p){ alert("El mes anterior no tiene datos."); return; }
  const cur=S.months[ui.month];
  if(cur && totals(ui.month).has && !confirm("Este mes ya tiene datos. ¿Sustituirlos por los ingresos y gastos fijos del mes anterior?")) return;
  const n=S.months[ui.month]=structuredClone(p);
  (n.income||[]).forEach(i=>i.id=uid()); n.note="";
  // solo se repite lo que se repite: los gastos variables, los movimientos y los saldos hay que volver a apuntarlos
  n.real={}; n.tx=[];   // lo cobrado/gastado se apunta en «Movimientos»: no se copia
  n.bal={cash:0,invest:0,other:0,debt:0}; n.hasBal=false;
  save(); render();
}
function onInput(e){
  const k=e.target.dataset.k; if(!k) return;
  const id=e.target.dataset.id, v=e.target.value;
  if(k==="incname"){ editIncome(a=>{ const i=a.find(i=>i.id===id); if(i) i.name=v; }); }
  else if(k==="incamt"){ editIncome(a=>{ const i=a.find(i=>i.id===id); if(i) i.amount=parseNum(v); }); }
  else if(k==="real"){ if(e.target.readOnly) return; ensureM(ui.month).real[id]=parseNum(v); }
  else if(k==="budget"){
    const val=parseNum(v); ensureM(ui.month).budget[id]=val;
    if(ui.month>=curMonth()){   // mes en curso o futuro: pasa a ser el presupuesto por defecto
      const c=S.cats.find(c=>c.id===id);
      if(c){ const old=c.budget; c.budget=val;
        // los meses pasados que seguían el defecto se quedan con el valor anterior
        for(const [mk,mm] of Object.entries(S.months)) if(mk<ui.month && mm.budget[id]===undefined) mm.budget[id]=old;
        // meses posteriores que solo heredaban el valor anterior (p. ej. por «Copiar mes anterior») vuelven a seguir el defecto
        for(const [mk,mm] of Object.entries(S.months)) if(mk>ui.month && mm.budget[id]===old) delete mm.budget[id]; }
    }
  }
  else if(k==="bal"){ const m=ensureM(ui.month); m.bal[id]=parseNum(v); m.hasBal=true; }
  else if(k==="note"){ ensureM(ui.month).note=v; }
  else if(k==="txdesc"){ const t=findTx(id); if(t) t.desc=v; }
  else if(k==="txamt"){ const t=findTx(id); if(t) t.amount=parseNum(v); const tt=el("txtotal"); if(tt) tt.textContent=eur(sum((getM(ui.month).tx||[]).map(x=>x.amount||0))); }
  else if(k==="txcat"){ const t=findTx(id); if(t) t.cat=v; }
  else return;
  save(); updateSummary();
}
document.addEventListener("input",onInput);
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="msel"||t.id==="ysel"){ ui.month=document.getElementById("ysel").value+"-"+String(document.getElementById("msel").value).padStart(2,"0"); render(); return; }
  if(t.id==="range"){ ui.range=+t.value; render(); return; }
  if(t.id==="yrsel"){ ui.year=+t.value; render(); return; }
  if(t.dataset.k==="txdate"){   // cambiar la fecha puede mover el movimiento a otro mes
    const tx=findTx(t.dataset.id);
    if(tx&&DATE_RE.test(t.value)){ const nk=t.value.slice(0,7), m=ensureM(ui.month);
      if(nk!==ui.month){ m.tx=m.tx.filter(x=>x!==tx); ensureM(nk).tx.push(tx); }
      tx.date=t.value; save(); render(); }
    return;
  }
  if(t.id==="txdesc"){ const g=guessCat(t.value); if(g&&!el("txcat").value) el("txcat").value=g; return; }   // sugiere partida
  if(t.id==="csvfile"&&t.files[0]){ readCSVFile(t.files[0]); t.value=""; return; }
  const di=t.dataset.imp;
  if(di&&ui.imp){
    const imp=ui.imp, it=imp.items[+t.dataset.i];
    if(di==="map"){ imp.map[t.dataset.field]=+t.value; buildItems(imp); }
    else if(di==="sign"){ imp.sign=t.value; buildItems(imp); }
    else if(di==="remember") imp.remember=t.checked;
    else if(di==="all") imp.items.forEach(i=>i.include=t.checked);
    else if(di==="inc"&&it) it.include=t.checked;
    else if(di==="cat"&&it){ it.cat=t.value; it.changed=true; }
    renderImp(); return;
  }
  if(t.classList.contains("num")&&!t.readOnly){ t.value=showNum(parseNum(t.value)); }
});
async function readCSVFile(f){
  try{
    const buf=await f.arrayBuffer(); let text;
    try{ text=new TextDecoder("utf-8",{fatal:true}).decode(buf); }catch(_){ text=new TextDecoder("windows-1252").decode(buf); }   // muchos bancos exportan en Latin-1
    const rows=parseCSV(text); if(rows.length<2) throw 0;
    startImport(rows,f.name); renderImp();
  }catch(e){ alert("No se ha podido leer el archivo como CSV."); }
}

function guessCat(desc){
  const d=" "+norm(desc)+" ";
  for(const r of S.rules) if(r.kw && d.includes(r.kw) && S.cats.some(c=>c.id===r.cat)) return r.cat;
  for(const [role,kws] of BUILTIN) if(kws.some(k=>d.includes(k.length<=3?" "+k+" ":k))){ const id=idOf(role); if(id) return id; }
  return "";
}

/* --- Importación de CSV del banco --- */
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/).slice(0,10).join("\n");
  const cnt=ch=>first.split(ch).length-1;
  const delim=[";",",","\t"].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[]; let row=[],cell="",q=false;
  const endRow=()=>{ row.push(cell); cell=""; if(row.some(c=>c.trim()!=="")) rows.push(row); row=[]; };
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===delim){ row.push(cell); cell=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; endRow(); }
    else cell+=ch;
  }
  endRow(); return rows;
}
function ymd(y,mo,d){ return (mo<1||mo>12||d<1||d>31)?null:`${y}-${pad2(mo)}-${pad2(d)}`; }
function parseDate(s){
  s=String(s||"").trim(); let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return ymd(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){ let y=+m[3]; if(y<100) y+=2000; return ymd(y,+m[2],+m[1]); }
  return null;
}
const cleanNum=s=>String(s==null?"":s).replace(/−/g,"-").replace(/[^\d.,+\-]/g,"");
function startImport(rows,fname){
  const h=rows.findIndex((r,i)=>i<25&&r.some(c=>/fecha|date/i.test(norm(c))));
  const data=rows.slice(h>=0?h+1:0).filter(r=>r.length>=2);
  const ncol=Math.max(...rows.map(r=>r.length));
  const headers=Array.from({length:ncol},(_,i)=>((h>=0&&rows[h][i])||"").trim()||`Columna ${i+1}`);
  const find=(...res)=>{ for(const re of res){ const i=headers.findIndex(x=>re.test(norm(x))); if(i>=0) return i; } return -1; };
  const map={date:find(/fecha.*oper/,/fecha|date/), desc:find(/concepto|descrip|detalle|movimiento|texto|observ|referencia/),
             amount:find(/importe|cantidad|amount|euros/), debit:find(/debit|cargo|debe/), credit:find(/credit|abono|haber/)};
  const colVals=i=>data.slice(0,40).map(r=>r[i]);
  if(map.date<0){ map.date=headers.findIndex((_,i)=>colVals(i).filter(v=>parseDate(v)).length>=Math.max(1,colVals(i).length*.6)); }
  if(map.amount<0&&map.debit<0){ for(let i=headers.length-1;i>=0;i--) if(i!==map.date&&colVals(i).filter(v=>/\d/.test(cleanNum(v))&&!parseDate(v)).length>=Math.max(1,colVals(i).length*.6)){ map.amount=i; break; } }
  if(map.desc<0){ let best=-1,len=-1; headers.forEach((_,i)=>{ if(i===map.date||i===map.amount) return; const l=sum(colVals(i).map(v=>String(v||"").length)); if(l>len){ len=l; best=i; } }); map.desc=best; }
  const amts=map.amount>=0?data.map(r=>parseNum(cleanNum(r[map.amount]))).filter(Boolean):[];
  ui.imp={fname,headers,rows:data,map,sign:amts.filter(a=>a<0).length>=amts.filter(a=>a>0).length?"neg":"pos",remember:true,items:[]};
  buildItems(ui.imp);
}
function fallbackCat(){ return idOf("otros")||(S.cats.find(c=>c.group==="want")||S.cats[0]||{}).id||""; }
function buildItems(imp){
  const {map}=imp, items=[]; let income=0, bad=0;
  for(const r of imp.rows){
    const date=parseDate(r[map.date]); if(!date){ bad++; continue; }
    let amt=0;   // positivo = gasto
    if(map.amount>=0){ const a=parseNum(cleanNum(r[map.amount])); amt=imp.sign==="neg"?-a:a; }
    else if(map.debit>=0||map.credit>=0){ const d=Math.abs(parseNum(cleanNum(r[map.debit]))), c=Math.abs(parseNum(cleanNum(r[map.credit]))); amt=d>0?d:-c; }
    if(!amt) continue;
    if(amt<0){ income++; continue; }
    const desc=String(r[map.desc]||"").trim().replace(/\s+/g," "), g=guessCat(desc), mk=date.slice(0,7);
    const dup=((S.months[mk]||{}).tx||[]).some(t=>t.date===date&&Math.abs(t.amount-amt)<0.005&&norm(t.desc)===norm(desc));
    items.push({date,desc,amount:Math.round(amt*100)/100,cat:g||fallbackCat(),guessed:!!g,include:!dup,dup,changed:false});
  }
  imp.items=items; imp.income=income; imp.bad=bad;
}

  const n=imp.items.length, inc=imp.items.filter(i=>i.include), total=sum(inc.map(i=>i.amount));
  const shown=imp.items.slice(0,300);
  return `<h2>Importar «${esc(imp.fname)}»</h2>
    <div class="impmap">${sel("date")}${sel("desc")}${sel("amount",true)}${sel("debit",true)}${sel("credit",true)}

function renderImp(){ const c=el("impcard"); if(c) c.innerHTML=impHtml(); }
function commitImport(){
  const imp=ui.imp, chosen=imp.items.filter(i=>i.include);
  if(!chosen.length){ alert("No hay movimientos marcados."); return; }
  let last=ui.month; const months=new Set(); let learned=0;
  for(const it of chosen){ const mk=it.date.slice(0,7); ensureM(mk).tx.push({id:uid(),date:it.date,desc:it.desc,cat:it.cat,amount:it.amount}); months.add(mk); if(mk>last||last===ui.month) last=mk; }
  if(imp.remember) for(const it of chosen) if(it.changed){
    const kw=keyword(it.desc); if(!kw) continue;
    const r=S.rules.find(r=>r.kw===kw); if(r) r.cat=it.cat; else { S.rules.push({id:uid(),kw,cat:it.cat}); learned++; }
  }
  ui.imp=null; ui.month=[...months].sort().pop(); save();
  ui.flash=`Importados ${chosen.length} movimientos en ${months.size} mes${months.size>1?"es":""}.${learned?` Reglas nuevas aprendidas: ${learned}.`:""}`; render();
}

/* Diagnóstico del modo «Presupuestado»: qué ocurriría si cumples el presupuesto y cómo se compara con la realidad */
function budgetInsights(t,keys){
  const out=[], add=(lv,txt)=>out.push([lv,txt]);
  if(t.income>0){
    if(t.saving<0) add("bad",`Con este presupuesto gastarías ${eur(-t.saving)} más de lo que ingresas. Hay que recortar o aumentar ingresos.`);
    else if(t.rate>=20) add("ok",`Si cumples el presupuesto ahorrarías ${eur(t.saving)} (${pct(t.rate)} de los ingresos): alcanzas el 20% recomendado.`);
    else if(t.rate>=10) add("warn",`Ahorrarías ${eur(t.saving)} (${pct(t.rate)}). Para llegar al 20% habría que recortar ${eur(t.income*.2-t.saving)} al mes.`);
    else add("bad",`Ahorrarías solo ${eur(t.saving)} (${pct(t.rate)}): es una tasa baja.`);
    const fx=t.fixed/t.income*100;
    add(fx>60?"bad":fx>50?"warn":"ok",`Gastos fijos previstos: ${eur(t.fixed)} (${pct(fx)} de los ingresos). Tras pagarlos quedarían ${eur(t.margin)}.${fx>50?" Es una proporción alta: deja poco margen.":""}`);
    if(t.want/t.income*100>25) add("warn",`Los caprichos previstos son el ${pct(t.want/t.income*100)} de tus ingresos.`);
    if(t.save>t.saving+1) add("warn",`Quieres destinar ${eur(t.save)} a ahorro/inversión, pero con este presupuesto solo sobran ${eur(Math.max(0,t.saving))}.`);
    else if(t.saving>0&&t.unassigned>t.income*.05) add("warn",`Te sobrarían ${eur(t.unassigned)} sin asignar a ninguna partida de ahorro.`);
  } else add("warn","No hay ingresos en este mes: indica tus ingresos para valorar el presupuesto.");
  // realidad frente a lo presupuestado en los últimos meses completos con gastos
  const done=keys.filter(k=>k<curMonth()&&hasSpend(k));
  if(done.length){
    const real=sum(done.map(k=>totals(k).expenses))/done.length, plan=sum(done.map(k=>totals(k).bexp))/done.length;
    if(plan>0) add(real>plan*1.1?"warn":"ok",`En los últimos ${done.length} mes${done.length>1?"es":""} completos gastaste de media ${eur(real)} frente a ${eur(plan)} presupuestados (${real>=plan?"+":""}${pct((real/plan-1)*100)}).`);
  }
  const col={ok:"var(--ok)",warn:"var(--warn)",bad:"var(--bad)"};
  return out.map(([l,x])=>`<div class="ins"><span class="dot" style="background:${col[l]}"></span><span>${esc(x)}</span></div>`).join("");
}
/* --- Ritmo del mes en curso --- */
function pace(){
  const k=curMonth(), m=getM(k), d=new Date(), day=d.getDate(), n=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(), f=day/n, pm=f*100;
  const vars=S.cats.filter(c=>c.group!=="save"&&!c.fixed&&!c.annual);
  const sp=sum(vars.map(c=>spent(m,c))), bu=sum(vars.map(c=>budgetOf(m,c)));
  if(bu<=0&&sp<=0) return `<div class="empty">Aún no hay gastos variables registrados este mes.</div>`;
  const proj=sp/f, col=proj>bu*1.1?"var(--bad)":proj>bu?"var(--warn)":"var(--ok)", t=totals(k);
  const fixedExp=sum(S.cats.filter(c=>c.fixed&&c.group!=="save"&&!c.annual).map(c=>Math.max(spent(m,c),budgetOf(m,c))));
  // pagos trimestrales/anuales: se esperan completos en su mes de cobro (o lo ya registrado si es mayor)
  const periodicExp=sum(S.cats.filter(c=>c.annual&&c.group!=="save").map(c=>dueIn(c,k)?Math.max(spent(m,c),c.budget):spent(m,c)));
  const projTotal=fixedExp+proj+periodicExp;
  const risky=vars.map(c=>({c,s:spent(m,c),b:budgetOf(m,c)})).filter(x=>x.b>0&&x.s>0&&x.s/f>x.b*1.1).sort((a,b)=>(b.s/f-b.b)-(a.s/f-a.b)).slice(0,3);
  return `<div class="meter"><div class="top"><span>Día ${day} de ${n}</span><b>${pct(pm)} del mes</b></div><div class="track"><div class="fill" style="width:${pm}%;background:var(--muted)"></div></div></div>
    <div class="meter"><div class="top"><span>Variables gastados</span><b>${eur(sp)} <span class="muted">de ${eur(bu)}</span></b></div><div class="track"><div class="fill" style="width:${Math.min(100,bu>0?sp/bu*100:100)}%;background:${col}"></div><div class="tick" style="left:${pm}%"></div></div></div>
    <div class="row"><span>Proyección de variables a fin de mes</span><b style="color:${col}">${eur(proj)}</b></div>
    <div class="row"><span>Proyección de gastos totales</span><b>${eur(projTotal)}</b></div>
    ${t.income>0?`<div class="row"><span>Ahorro previsto</span><b class="${t.income-projTotal>=0?"pos":"neg"}">${eur(t.income-projTotal)}</b></div>`:""}
    ${risky.map(x=>`<div class="ins"><span class="dot" style="background:var(--warn)"></span><span>${esc(x.c.name)}: llevas ${eur(x.s)} y, a este ritmo, acabarás en ${eur(x.s/f)} frente a ${eur(x.b)} presupuestados.</span></div>`).join("")}
    <div class="hint">${day<5?"Los primeros días la proyección es poco fiable. ":""}La marca vertical indica cuánto del mes ha pasado: si la barra la supera, vas por encima del ritmo. Fijos mensuales previstos: ${eur(fixedExp)}; pagos trimestrales/anuales esperados este mes: ${eur(periodicExp)}.</div>`;
}
/* --- Comparativa con el mismo mes del año anterior --- */
function yoy(k){
  const pk=shiftMonth(k,-12), a=totals(k), b=totals(pk);
  if(!b.has) return `<div class="empty">No hay datos de ${monthLabel(pk)} con los que comparar.</div>`;
  const row=([l,f,dir])=>{ const dl=a[f]-b[f], pc=b[f]?dl/Math.abs(b[f])*100:null, good=dl*dir>=0;
    return `<tr><td>${l}</td><td>${eur(a[f])}</td><td>${eur(b[f])}</td><td class="${Math.abs(dl)<.005?"":good?"pos":"neg"}">${dl>=0?"+":""}${eur(dl)}${pc===null?"":` <span class="muted">(${dl>=0?"+":""}${Math.round(pc)}%)</span>`}</td></tr>`; };
  const ch=S.cats.filter(c=>c.group!=="save").map(c=>({c,d:costOf(getM(k),c,k)-costOf(getM(pk),c,pk)})).filter(x=>Math.abs(x.d)>=1).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d)).slice(0,4);
  return `<table class="mx"><thead><tr><th></th><th>${monthLabel(k)}</th><th>${monthLabel(pk)}</th><th>Variación</th></tr></thead><tbody>
    ${[["Ingresos","income",1],["Gastos fijos","fixed",-1],["Gastos variables","variable",-1],["Total gastos","expenses",-1],["Ahorro","saving",1]].map(row).join("")}
    <tr><td>Tasa de ahorro</td><td>${pct(a.rate)}</td><td>${pct(b.rate)}</td><td class="${a.rate>=b.rate?"pos":"neg"}">${a.rate>=b.rate?"+":""}${Math.round(a.rate-b.rate)} pts</td></tr></tbody></table>
    ${ch.length?`<h3 style="margin-top:14px">Partidas que más han cambiado</h3>${ch.map(x=>`<div class="row"><span>${esc(x.c.name)}</span><b class="${x.d<=0?"pos":"neg"}">${x.d>=0?"+":""}${eur(x.d)}</b></div>`).join("")}`:""}`;
}
/* --- Objetivos de ahorro --- */
function monthsBetween(a,b){ const [ya,ma]=a.split("-").map(Number), [yb,mb]=b.split("-").map(Number); return (yb-ya)*12+(mb-ma); }
function goalProgress(g){
  let p=g.start||0; const c=g.cat&&S.cats.find(c=>c.id===g.cat);
  if(c) for(const m of Object.values(S.months)) p+=spent(m,c);
  return p;
}
function goalsHtml(){
  return S.goals.map(g=>{
    const prog=goalProgress(g), target=g.target||0, remaining=Math.max(0,target-prog), pc=target>0?Math.min(100,prog/target*100):0;
    const left=monthsBetween(curMonth(),g.date)+1, need=left>0?remaining/left:null, c=g.cat&&S.cats.find(c=>c.id===g.cat);
    let pc3=null; if(c){ const ks=series(curMonth(),3).filter(k=>S.months[k]); if(ks.length) pc3=sum(ks.map(k=>spent(S.months[k],c)))/ks.length; }
    let msg,col;
    if(target>0&&remaining<=0){ msg="¡Objetivo conseguido!"; col="var(--ok)"; }
    else if(left<=0){ msg=`Plazo vencido: faltan ${eur(remaining)}.`; col="var(--bad)"; }
    else{
      msg=`Faltan ${eur(remaining)} · necesitas ${eur(need)}/mes hasta ${monthLabel(g.date)}.`;
      if(pc3!==null){
        if(pc3>=need){ msg+=` Vas bien: aportas ~${eur(pc3)}/mes.`; col="var(--ok)"; }
        else{ msg+=` Aportas ~${eur(pc3)}/mes: te faltan ${eur(need-pc3)}/mes más.`; col="var(--warn)"; }
        if(pc3>0){ msg+=` A este ritmo llegarías en ${monthLabel(shiftMonth(curMonth(),Math.ceil(remaining/pc3)-1))}.`; }
      } else col="var(--accent)";
    }
    return `<div class="meter"><div class="top"><span><b>${esc(g.name)}</b></span><b>${eur(prog)} <span class="muted">/ ${eur(target)}</span></b></div>
      <div class="track"><div class="fill" style="width:${pc}%;background:${col}"></div></div><div class="hint">${esc(msg)}</div></div>`;
  }).join("")||`<div class="empty">Crea un objetivo en Ajustes.</div>`;
}

function donutFrom(items,emptyMsg){
  if(!items.length) return `<div class="empty">${emptyMsg}</div>`;
  // todas las partidas (o categorías), sin agrupar en «resto»: a partir del 10.º color se reparten tonos por el círculo cromático
  const col=i=>items[i].rest?"var(--line2)":i<PAL.length?PAL[i]:`hsl(${Math.round((i-PAL.length)*137.5+20)%360} 55% 55%)`;   // «Resto» en gris
  const tot=sum(items.map(x=>x.v)), cx=100, cy=100, two=items.some(x=>x.kids);
  // con categorías: anillo interior = categorías; exterior = sus partidas, en tonos del color de su categoría
  const ring=(r,w,segs)=>{ const C=2*Math.PI*r; let off=0, s="";
    segs.forEach(x=>{ const l=x.v/tot*C; s+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${x.c}" stroke-width="${w}" stroke-dasharray="${Math.max(0,l-(two?.6:0))} ${C-l+(two?.6:0)}" stroke-dashoffset="${-off}"><title>${esc(x.n)} · ${eur(x.v)} (${pct(x.v/tot*100)})</title></circle>`; off+=l; });
    return s; };
  const shade=(c,j,n)=>n<2?c:`color-mix(in srgb, ${c} ${Math.round(100-j*55/(n-1))}%, var(--card))`;
  let rings;
  if(two) rings=ring(56,26,items.map((x,i)=>({n:x.n,v:x.v,c:col(i)})))+ring(81,18,items.flatMap((x,i)=>x.kids.map((k,j)=>({n:`${k.n} (${x.n})`,v:k.v,c:shade(col(i),j,x.kids.length)}))));
  else rings=ring(70,30,items.map((x,i)=>({n:x.n,v:x.v,c:col(i)})));
  let s=`<div class="donut"><svg viewBox="0 0 200 200" width="${two?250:230}" role="img" aria-label="Reparto de gastos"><g transform="rotate(-90 ${cx} ${cy})">${rings}</g>
    <text x="${cx}" y="${cy-1}" text-anchor="middle" style="font-size:${two?14:18}px;font-weight:700;fill:var(--ink)">${eur(tot,two?0:2)}</text><text x="${cx}" y="${cy+14}" text-anchor="middle" style="font-size:10px">gastos</text></svg>`;
  if(two){
    s+=`<div class="dlegend grouped">${items.map((x,i)=>`<details><summary><i style="background:${col(i)}"></i><span class="n">${esc(x.n)} <small>${x.kids.length}</small></span><b>${eur(x.v)}</b><span class="p">${pct(x.v/tot*100)}</span></summary>
      ${x.kids.map((k,j)=>`<div class="kid"><i style="background:${shade(col(i),j,x.kids.length)}"></i><span class="n">${esc(k.n)}</span><b>${eur(k.v)}</b><span class="p">${pct(k.v/x.v*100)}</span></div>`).join("")}</details>`).join("")}</div>
      <div class="hint" style="align-self:stretch">Anillo interior: categorías. Exterior: sus partidas. Toca una categoría para ver sus partidas (el % es sobre la categoría).</div></div>`;
  } else s+=`<div class="dlegend">${items.map((x,i)=>`<div><i style="background:${col(i)}"></i><span class="n">${esc(x.n)}</span><b>${eur(x.v)}</b><span class="p">${pct(x.v/tot*100)}</span></div>`).join("")}</div></div>`;
  return s;
}

function insights(t,T,emerg,avgNeed){

    else if(t.rate>=20) add("ok",`Tasa de ahorro del ${pct(t.rate)}: cumples (o superas) el 20% recomendado.`);
    else if(t.rate>=10) add("warn",`Tasa de ahorro del ${pct(t.rate)}. Está por debajo del 20% recomendado; ${eur(t.income*.2-t.saving)} más al mes lo alcanzarían.`);
    else add("bad",`Tasa de ahorro del ${pct(t.rate)}, baja. Intenta acercarte al 10% como primer paso.`);
    const viv=realByRole(ui.month,"vivienda")/t.income*100; if(viv>30) add("warn",`La vivienda supone el ${pct(viv)} de tus ingresos; lo recomendable es no pasar del 30%.`);

    if(t.fixed>0) add(fx>60?"bad":fx>50?"warn":"ok",`Gastos fijos: ${eur(t.fixed)} (${pct(fx)} de los ingresos). Tras pagarlos te quedan ${eur(t.margin)}.${fx>50?" Es una proporción alta: dejan poco margen de maniobra.":""}`);
    if(t.want/t.income*100>25) add("warn",`Los caprichos suponen el ${pct(t.want/t.income*100)} de tus ingresos (${eur(t.vc)} variables y ${eur(t.fc)} fijos).`);
    if(t.saving>0 && t.unassigned>t.income*.05) add("warn",`Tienes ${eur(t.unassigned)} sin asignar: dinero que sobra pero no está registrado como ahorro/inversión.`);
  }
  const over=S.cats.filter(c=>c.group!=="save"&&!c.annual).map(c=>({c,b:budgetOf(m,c),r:spent(m,c)})).filter(x=>x.b>0&&x.r>x.b*1.1).sort((a,b)=>(b.r-b.b)-(a.r-a.b)).slice(0,3);

}

/* Vecino de una partida para subir/bajar: en la vista agrupada, dentro de su grupo; en la lista simple, en toda la lista */
function neighborIdx(c,dir){
  const i=S.cats.indexOf(c);
  if(ui.catView==="list"){ const j=i+dir; return j>=0&&j<S.cats.length?j:-1; }
  for(let j=i+dir;j>=0&&j<S.cats.length;j+=dir) if((S.cats[j].family||null)===(c.family||null)) return j;
  return -1;
}

function catListHtml(){

document.addEventListener("input",e=>{
  const f=e.target.dataset.s; if(!f) return;
  const c=S.cats.find(c=>c.id===e.target.dataset.id); if(!c) return;
  const v=e.target.value;
  if(f==="family"){   // cambiar de grupo (o crear uno nuevo desde el desplegable)
    if(v==="__new__"){ const nf=addFamily(); c.family=nf?nf.id:(c.family||null); } else c.family=v||null;
    save(); render();
    const it=document.querySelector(`.catitem[data-id="${c.id}"]`); if(it) it.scrollIntoView({block:"center"});
    return;
  }
  if(f==="budget"){   // meses pasados: conservan el valor anterior; mes en curso y siguientes: siguen el nuevo valor (se quitan los ajustes que quedaron desfasados)
    const old=c.budget;
    for(const [mk,mm] of Object.entries(S.months)){
      if(mk<curMonth()){ if(mm.budget[c.id]===undefined) mm.budget[c.id]=old; }
      else delete mm.budget[c.id];
    }
  }
  if(f==="budget") c.budget=parseNum(v);
  else if(f==="fixed") c.fixed=v==="1";
  else if(f==="period"){ c.period=v; c.annual=v!=="month"; }
  else if(f==="day"){ const n=parseInt(v,10); c.day=n>=1&&n<=31?n:null; }
  else if(f==="chargeMonth") c.chargeMonth=+v||null;
  else c[f]=v;
  if(f==="group"&&v==="save"){ c.period="month"; c.annual=false; c.fixed=false; c.chargeMonth=null; }
  save();
  if(f==="group"||f==="period"){ render(); const nx=document.querySelector(`[data-s="${f}"][data-id="${c.id}"]`); if(nx) nx.focus(); }   // cambia qué opciones están activas
  else if(f==="fixed"||f==="day"||f==="chargeMonth") refreshCard(c);                                                                      // solo las etiquetas resumen
});

/* Inserta una partida nueva en la posición indicada (hereda tipo y fijo/variable de la fila vecina) y pone el cursor en su nombre */
function insertCat(pos,fam,refCat){
  const ref=refCat!==undefined?(refCat||{group:"want",fixed:false,family:null}):(S.cats[Math.max(0,pos-1)]||S.cats[pos]||{group:"want",fixed:false,family:null});
  const family=fam!==undefined?fam:(ref.family||null);   // hereda el grupo de la fila vecina
  const nc={id:uid(),name:"Nueva partida",group:ref.group,budget:0,fixed:ref.group!=="save"&&!!ref.fixed,annual:false,period:"month",day:null,chargeMonth:null,family};
  S.cats.splice(Math.min(Math.max(pos,0),S.cats.length),0,nc); ui.openCat=nc.id; save(); render();   // la tarjeta nueva queda abierta para configurarla
  const inp=document.querySelector(`input[data-s="name"][data-id="${nc.id}"]`);
  if(inp){ inp.scrollIntoView({block:"center"}); inp.focus(); inp.select(); }
}
/* Partida nueva al final de un grupo */
function addCatToFamily(fid){
  const mates=catsOfFamily(fid), last=mates[mates.length-1];
  insertCat(last?S.cats.indexOf(last)+1:S.cats.length, fid||null, last||null);
}
function moveCat(id,dir){
  const c=S.cats.find(c=>c.id===id); if(!c) return;
  const i=S.cats.indexOf(c), j=neighborIdx(c,dir); if(j<0) return;
  [S.cats[i],S.cats[j]]=[S.cats[j],S.cats[i]]; save(); render();
  const b=document.querySelector(`[data-a="${dir<0?"catup":"catdown"}"][data-id="${id}"]`); if(b&&!b.disabled) b.focus();   // para poder seguir pulsando
}
function moveCatTo(from,to){
  const i=S.cats.findIndex(c=>c.id===from), t=S.cats.findIndex(c=>c.id===to); if(i<0||t<0||i===t) return;
  const tf=S.cats[t].family||null, [c]=S.cats.splice(i,1); S.cats.splice(t,0,c);   // queda en la posición del destino
  if(ui.catView!=="list") c.family=tf;   // en la vista agrupada, soltarla sobre una partida de otro grupo la cambia de grupo
  save(); render();
}
function moveCatToFamily(from,fid){      // soltar sobre la cabecera de un grupo: pasa al final de ese grupo
  const i=S.cats.findIndex(c=>c.id===from); if(i<0) return;
  const [c]=S.cats.splice(i,1); c.family=fid||null;
  const mates=catsOfFamily(fid), last=mates[mates.length-1];
  S.cats.splice(last?S.cats.indexOf(last)+1:S.cats.length,0,c); save(); render();
}

function addFamily(){
  const n=(prompt("Nombre de la nueva categoría (p. ej. Mascotas, Hijos, Gimnasio…)")||"").trim(); if(!n) return null;
  const f={id:uid(),name:n}; S.families.push(f); return f;
}
function moveFamily(id,dir){
  const i=S.families.findIndex(f=>f.id===id), j=i+dir; if(i<0||j<0||j>=S.families.length) return;
  [S.families[i],S.families[j]]=[S.families[j],S.families[i]]; save(); render();
}
function delFamily(id){
  const f=S.families.find(f=>f.id===id); if(!f) return; const n=catsOfFamily(id).length;
  if(!confirm(`¿Eliminar la categoría «${f.name}»?${n?` Sus ${n} partidas pasarán a «Sin categoría» (no se borran).`:""}`)) return;
  S.cats.forEach(c=>{ if(c.family===id) c.family=null; }); S.families=S.families.filter(x=>x.id!==id); save(); render();
}

function download(name,text,type){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function demo(){
  if(Object.keys(S.months).length){
    if(!confirm("Se sustituirán los últimos 9 meses por datos de ejemplo (se descargará antes una copia de tus datos). ¿Continuar?")) return;
    backupDownload("antes-de-demo");
  }
  if(!S.cats.length) S.cats=structuredClone(DEFAULT_CATS);
  const byRole=Object.fromEntries(S.cats.filter(c=>c.role).map(c=>[c.role,c.id]));
  let seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  let cash=6500, invest=18000, debt=142000;
  series(curMonth(),9).forEach((k,i)=>{
    const m=S.months[k]=emptyMonth(), v=(b,sp)=>Math.round(b*(1+(rnd()-.5)*sp));
    m.income=[{id:uid(),name:"Nómina 1",amount:1850},{id:uid(),name:"Nómina 2",amount:1450},...(i%4===3?[{id:uid(),name:"Paga extra",amount:900}]:[])];
    const r=new Proxy({},{get:(_,k)=>m.real[byRole[k]],set:(_,k,v)=>{ if(byRole[k]) m.real[byRole[k]]=v; return true; }});
    r.vivienda=720; r.suministros=v(130,.5); r.internet=55; r.comunidad=60; r.super=v(460,.2); r.transporte=v(160,.4); r.salud=v(40,1.5);
    r.seguros=i%3===0?210:70; r.deuda=0; r.educacion=100; r.restaurantes=v(130,.6); r.ocio=v(85,.7); r.suscripciones=36; r.ropa=v(60,1.2);
    r.viajes=i===5?600:v(80,1.5); r.hogar=v(60,1.5); r.personal=v(30,.5); r.otros=v(50,1.5);
    const t=totals(k), sav=Math.max(0,t.saving); r.emergencia=Math.round(sav*.35); r.inversion=Math.round(sav*.35); r.pension=100; r.metas=100;
    cash+=sav*.5; invest+=r.inversion+r.pension+invest*.004; debt-=620;
    m.bal={cash:Math.round(cash),invest:Math.round(invest),other:0,debt:Math.round(debt)}; m.hasBal=true;
  });
  if(!S.goals.length&&byRole.metas) S.goals.push({id:uid(),name:"Vacaciones de verano",target:3000,start:300,date:shiftMonth(curMonth(),8),cat:byRole.metas});
  if(!S.incomeDefaults.length) S.incomeDefaults=[{id:uid(),name:"Nómina 1",amount:1850},{id:uid(),name:"Nómina 2",amount:1450}];
  save(); ui.page="panel"; render();
}
function csv(){
  const head=["Mes","Tipo","Concepto","Categoría","Clase","Fijo/Variable","Presupuesto","Importe"], L=[head];
  Object.keys(S.months).sort().forEach(k=>{ const m=S.months[k];
    incomeOf(m).forEach(i=>L.push([k,"Ingreso",i.name,"","","","",i.amount||0]));
    S.cats.forEach(c=>{ const v=costOf(m,c,k); if(v||budgetOf(m,c)) L.push([k,c.group==="save"?"Ahorro":"Gasto",c.name+(c.annual?` (${c.period==="quarter"?"trimestral":"anual"}; el presupuesto es la parte mensual)`:""),famName(c.family||null),GROUPS[c.group],c.group==="save"?"":c.fixed?"Fijo":"Variable",budgetOf(m,c),v]); }); });
  // importes con coma decimal para que Excel/Numbers en español los reconozcan como números
